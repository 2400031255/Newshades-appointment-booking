<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Newshades Family Salon</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../style.css"/>
<style>
.nb-layout{display:flex;gap:20px;align-items:flex-start;}
.nb-form{display:flex;flex-direction:column;gap:16px;flex:1;min-width:0;max-width:860px;}
.nb-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(61,26,58,0.08);}
.nb-card-title{font-size:14px;font-weight:600;color:#3d1a3a;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.nb-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.nb-field input,.nb-field select{width:100%;padding:10px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;color:#3d1a3a;background:#fafafa;outline:none;transition:border-color 0.2s;box-sizing:border-box;}
.nb-field input:focus,.nb-field select:focus{border-color:#7b3f6e;background:#fff;}
.nb-field small{font-size:11px;margin-top:4px;display:block;}
.nb-summary{width:220px;flex-shrink:0;background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(61,26,58,0.08);position:sticky;top:20px;z-index:0;}
.nbs-title{font-size:13px;font-weight:700;color:#3d1a3a;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid #f0e8f8;}
.nbs-empty{font-size:12px;color:#b09aaa;text-align:center;padding:20px 0;}
.nbs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.nbs-item{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:12px;}
.nbs-item-name{color:#3d1a3a;font-weight:500;flex:1;line-height:1.3;}
.nbs-item-price{color:#7b3f6e;font-weight:600;white-space:nowrap;}
.nbs-footer{border-top:1.5px solid #f0e8f8;padding-top:10px;display:flex;flex-direction:column;gap:6px;}
.nbs-row{display:flex;justify-content:space-between;font-size:12px;color:#7a6a75;}
.nbs-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:#3d1a3a;margin-top:4px;}
.svc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.svc-tab{padding:5px 14px;border-radius:20px;border:1.5px solid #e8dce4;background:#fafafa;color:#7b3f6e;font-size:12px;font-weight:500;cursor:pointer;}
.svc-tab.active{background:#7b3f6e;color:#fff;border-color:#7b3f6e;}
.svc-search-wrap{position:relative;margin-bottom:14px;}
.svc-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
#svcSearch{width:100%;padding:10px 36px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;outline:none;background:#fafafa;box-sizing:border-box;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:10px 12px;background:#fdf6f0;border-radius:10px;border:1px solid #f0e0d0;}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#fff;border:1.5px solid #e8dce4;border-radius:20px;font-size:12px;color:#3d1a3a;}
.chip-name{font-weight:500;}.chip-price{color:#7b3f6e;font-weight:600;}.chip-remove{cursor:pointer;color:#aaa;font-size:11px;}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-height:340px;overflow-y:auto;padding-right:4px;}
.svc-card{display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid #e8dce4;border-radius:12px;cursor:pointer;background:#fafafa;transition:border-color 0.12s,background 0.12s;}
.svc-card:hover{border-color:#c9a96e;background:#fffbf5;}
.svc-card input[type=checkbox]{display:none;}
.svc-card.checked{border-color:#7b3f6e;background:#f5f0ff;box-shadow:0 0 0 3px rgba(123,63,110,0.1);}
.svc-card-inner{display:flex;flex-direction:column;gap:2px;}
.svc-card-name{font-size:13px;font-weight:500;color:#3d1a3a;line-height:1.3;}
.svc-card-price{font-size:12px;color:#7b3f6e;font-weight:600;}
.qty-input{width:100%;padding:4px 8px;border:1px solid #e8dce4;border-radius:6px;font-size:12px;text-align:center;background:#fff;outline:none;}
.no-results{text-align:center;padding:24px;color:#b09aaa;font-size:13px;}
.sel-badge{background:#7b3f6e;color:#fff;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;}
.nb-submit{padding:14px;background:linear-gradient(135deg,#3d1a3a,#7b3f6e);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
.sv-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(61,26,58,0.08);}
.sv-card-title{font-size:14px;font-weight:600;color:#3d1a3a;display:flex;align-items:center;gap:10px;}
.svc-total-badge{background:#f0e8f8;color:#7b3f6e;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.add-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.add-form input[type=text]{flex:2;min-width:140px;padding:10px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;outline:none;background:#fafafa;}
.price-wrap{flex:1;min-width:110px;position:relative;}
.rupee{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7b3f6e;font-weight:600;font-size:14px;pointer-events:none;}
.price-wrap input{width:100%;padding:10px 14px 10px 28px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;outline:none;background:#fafafa;box-sizing:border-box;}
.btn-add{padding:10px 22px;background:linear-gradient(135deg,#3d1a3a,#7b3f6e);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.sv-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.sv-tab{padding:6px 14px;border-radius:20px;border:1.5px solid #e8dce4;background:#fafafa;color:#7b3f6e;font-size:12px;font-weight:500;cursor:pointer;}
.sv-tab.active{background:#7b3f6e;color:#fff;border-color:#7b3f6e;}
.sv-search-wrap{position:relative;display:flex;align-items:center;margin-bottom:14px;}
.sv-search-wrap span{position:absolute;left:12px;font-size:14px;}
#svSearch{width:100%;padding:9px 36px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;outline:none;background:#fafafa;box-sizing:border-box;}
.sv-table-wrap{overflow-x:auto;}
.sv-table{width:100%;border-collapse:collapse;font-size:13px;}
.sv-table thead th{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:#8a7a85;padding:0 12px 10px;font-weight:500;border-bottom:2px solid #f0e8f8;}
.sv-table td{padding:11px 12px;border-bottom:1px solid #f9f4fc;vertical-align:middle;}
.sv-table tr:last-child td{border-bottom:none;}
.sv-id{color:#ccc;font-size:11px;width:30px;}
.sv-name{font-weight:500;color:#3d1a3a;}
.sv-price{color:#7b3f6e;font-weight:600;}
.sv-cat-badge{background:#f0e8f8;color:#7b3f6e;font-size:11px;padding:2px 8px;border-radius:20px;}
.sv-actions{text-align:right;white-space:nowrap;}
.sv-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid;transition:all 0.15s;}
.sv-btn.edit{background:#f5f0ff;color:#3d1a3a;border-color:#e8dce4;}
.sv-btn.del{background:#fff0f3;color:#c0394a;border-color:#fce4ec;}
.sv-btn.save{padding:10px 22px;background:linear-gradient(135deg,#3d1a3a,#7b3f6e);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
.sv-btn.cancel{padding:10px 18px;background:#f5f5f5;color:#666;border-color:#e0e0e0;border-radius:10px;font-size:14px;}
.sv-empty{text-align:center;padding:24px;color:#b09aaa;font-size:13px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:420px;box-shadow:0 12px 48px rgba(61,26,58,0.22);}
.modal-title{font-size:16px;font-weight:700;color:#3d1a3a;margin-bottom:20px;}
.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.modal-field label{font-size:12px;font-weight:600;color:#7b3f6e;text-transform:uppercase;letter-spacing:0.5px;}
.modal-field input{padding:10px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;outline:none;background:#fafafa;}
.modal-field .price-wrap input{padding-left:28px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.receipt-page{display:flex;flex-direction:column;align-items:center;padding:32px 16px;}
.receipt-actions{display:flex;gap:12px;margin-bottom:28px;}
.btn-print{padding:12px 28px;background:linear-gradient(135deg,#3d1a3a,#7b3f6e);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;}
.btn-new{padding:12px 24px;background:#fff;color:#3d1a3a;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;}
.thermal-wrap{filter:drop-shadow(0 8px 40px rgba(61,26,58,0.18));}
.thermal-receipt{width:320px;background:#fff;font-family:'Courier New',Courier,monospace;font-size:12px;color:#111;padding:20px 18px 28px;}
.t-header{text-align:center;margin-bottom:10px;}
.t-salon-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.t-tagline{font-size:10px;letter-spacing:1.5px;color:#444;margin-bottom:8px;font-style:italic;}
.t-dots{font-size:10px;color:#888;letter-spacing:2px;margin:4px 0;}
.t-receipt-title{font-size:13px;font-weight:700;letter-spacing:3px;margin:6px 0;}
.t-info{margin:10px 0;}
.t-row{display:flex;justify-content:space-between;margin:4px 0;font-size:11.5px;}
.t-row span:first-child{color:#555;}
.t-row span:last-child{font-weight:600;text-align:right;max-width:60%;}
.t-dashed{border-top:1px dashed #aaa;margin:8px 0;}
.t-solid{border-top:1.5px solid #111;margin:6px 0;}
.t-table-head{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:2px;color:#333;margin:4px 0;}
.t-item{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;font-size:12px;}
.t-item-name{flex:1;padding-right:8px;}
.t-item-name small{font-size:10px;color:#666;margin-left:4px;}
.t-item-price{font-weight:600;white-space:nowrap;}
.t-total-row{display:flex;justify-content:space-between;font-size:11.5px;margin:4px 0;color:#444;}
.t-grand-line{margin:6px 0;}
.t-grand{display:flex;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:0.5px;padding:6px 0;}
.t-payment{margin:8px 0;}
.t-paid{color:#111;font-weight:700;}
.t-footer{text-align:center;margin-top:12px;}
.t-thankyou{font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:6px;}
.t-footer-sub{font-size:10px;color:#555;margin:2px 0;}
.cust-av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e8a0b0,#c9a96e);color:#fff;font-size:12px;font-weight:700;margin-right:6px;}
.visit-badge{background:#f0e8f8;color:#7b3f6e;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.search-wrap{position:relative;margin-bottom:20px;display:flex;align-items:center;}
.search-icon{position:absolute;left:14px;font-size:16px;opacity:0.5;}
#custSearchInput{width:100%;padding:12px 40px 12px 42px;border:1.5px solid #e8dce4;border-radius:12px;font-size:14px;background:#fff;outline:none;box-sizing:border-box;}
@media(max-width:860px){.nb-layout{flex-direction:column;}.nb-summary{width:100%;position:static;}}
@media(max-width:600px){.nb-row{grid-template-columns:1fr;}.svc-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}.add-form{flex-direction:column;}}
@media print{@page{size:80mm auto;margin:0;}html,body{width:80mm!important;margin:0!important;padding:0!important;background:#fff!important;}body>*{display:none!important;}.receipt-page{display:flex!important;}.thermal-wrap,.thermal-receipt{display:block!important;}.no-print,.receipt-actions{display:none!important;}.receipt-page{padding:0!important;background:#fff!important;align-items:flex-start!important;}.thermal-wrap{filter:none!important;width:72mm!important;}.thermal-receipt{width:72mm!important;padding:2mm 0 6mm 0!important;font-size:9pt!important;clip-path:none!important;}}
</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#e8a0b0,#c9a96e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;">N</div>
    <div><h2>Newshades</h2><small>Family Salon</small></div>
  </div>
  <nav id="sidebarNav">
    <a href="#" onclick="navigate('dashboard')" id="nav-dashboard"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><path d='M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z'/><path d='M9 21V12h6v9'/></svg> Dashboard</a>
    <a href="#" onclick="navigate('newbill')" id="nav-newbill" class="role-emp"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><rect x='4' y='2' width='16' height='20' rx='2'/><line x1='8' y1='7' x2='16' y2='7'/><line x1='8' y1='11' x2='16' y2='11'/><line x1='8' y1='15' x2='12' y2='15'/></svg> New Bill</a>
    <a href="#" onclick="navigate('customers')" id="nav-customers"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><circle cx='9' cy='7' r='4'/><path d='M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2'/></svg> Customers</a>
    <a href="#" onclick="navigate('report')" id="nav-report" class="role-admin"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M8 17V13'/><path d='M12 17V9'/><path d='M16 17v-4'/></svg> Daily Report</a>
    <a href="#" onclick="navigate('revenue')" id="nav-revenue" class="role-admin"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><polyline points='22 7 13.5 15.5 8.5 10.5 2 17'/><polyline points='16 7 22 7 22 13'/></svg> Revenue List</a>
    <a href="#" onclick="navigate('services')" id="nav-services" class="role-admin"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><circle cx='12' cy='12' r='3'/><path d='M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14'/></svg> Manage Services</a>
    <a href="#" onclick="navigate('monthly')" id="nav-monthly" class="role-admin"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg> Monthly Report</a>
    <a href="#" onclick="navigate('profile')" id="nav-profile" class="role-admin"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><circle cx='12' cy='8' r='4'/><path d='M4 20c0-4 3.6-7 8-7s8 3 8 7'/></svg> My Profile</a>
  </nav>
  <div class="sidebar-footer">
    <div class="role-badge" id="roleBadge"></div>
    <a href="#" onclick="doLogout()" class="logout-btn">Sign Out</a>
  </div>
</aside>

<main class="content" id="mainContent">
  <div id="alertBox"></div>
  <div id="pageContainer"></div>
</main>

<!-- Login overlay -->
<div id="loginOverlay" style="display:none;position:fixed;inset:0;background:#1a0d1e;z-index:2000;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:40px;width:min(100%,400px);margin:16px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e8a0b0,#c9a96e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:22px;margin:0 auto 12px;">N</div>
      <h2 style="font-family:'Cormorant Garamond',serif;color:#3d1a3a;font-size:22px;">Newshades Family Salon</h2>
      <p style="color:#888;font-size:13px;margin-top:4px;">Sign in to continue</p>
    </div>
    <div id="loginTabs" style="display:flex;gap:8px;margin-bottom:20px;">
      <button onclick="setLoginTab('admin')" id="tabAdmin" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid #7b3f6e;background:#7b3f6e;color:#fff;font-weight:600;cursor:pointer;font-size:13px;">Admin</button>
      <button onclick="setLoginTab('employee')" id="tabEmp" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid #e8dce4;background:#fff;color:#7b3f6e;font-weight:600;cursor:pointer;font-size:13px;">Employee</button>
    </div>
    <div id="adminLoginForm">
      <input type="text" id="loginUser" placeholder="Username" style="width:100%;padding:11px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box;"/>
      <input type="password" id="loginPass" placeholder="Password" style="width:100%;padding:11px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;margin-bottom:16px;outline:none;box-sizing:border-box;" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div id="empLoginForm" style="display:none;">
      <input type="password" id="loginEmpPass" placeholder="Employee Password" style="width:100%;padding:11px 14px;border:1.5px solid #e8dce4;border-radius:10px;font-size:14px;margin-bottom:16px;outline:none;box-sizing:border-box;" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div id="loginErr" style="color:#c0394a;font-size:13px;margin-bottom:10px;display:none;"></div>
    <button onclick="doLogin()" style="width:100%;padding:13px;background:linear-gradient(135deg,#3d1a3a,#7b3f6e);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;">Sign In</button>
    <p style="text-align:center;font-size:11px;color:#aaa;margin-top:16px;">Default: admin / salon123</p>
  </div>
</div>

<script src="app/data.js"></script>
<script src="app/pages.js"></script>
<script src="app/app.js"></script>
</body>
</html>
