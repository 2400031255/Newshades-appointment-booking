<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payroll – New Shades Admin</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Admin Panel</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="billing.html"><span class="sidebar-nav-label"><i class="fas fa-file-invoice-dollar" style="color:var(--gold);"></i> Billing</span></a>
    <a href="services.html"><span class="sidebar-nav-label"><i class="fas fa-concierge-bell"></i> Services</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> Enquiries</span></a>
    <a href="employees.html"><span class="sidebar-nav-label"><i class="fas fa-user-tie"></i> Employees</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> Attendance</span></a>
    <a href="attendance.html#monthly-report" class="admin-only-link"><span class="sidebar-nav-label" style="padding-left:18px;font-size:0.8rem;"><i class="fas fa-chart-bar" style="color:var(--gold);"></i> Monthly Report</span></a>
    <a href="payroll.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> Payroll</span></a>
    <a href="leave_requests.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="settings.html"><span class="sidebar-nav-label"><i class="fab fa-whatsapp" style="color:#25d366;"></i> Settings</span></a>
    <a href="gallery.html"><span class="sidebar-nav-label"><i class="fas fa-images"></i> Gallery</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Payroll</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="admin-card mb-4">
      <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
        <h6 class="fw-bold mb-0" style="color:#fff;">Monthly Payroll</h6>
        <input type="month" id="payMonth" style="padding:8px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;color-scheme:dark;"/>
        <button onclick="loadPayroll()" class="btn-gold" style="padding:8px 20px;"><i class="fas fa-search me-2"></i>Load</button>
      </div>
      <div id="payrollGrid"><p style="color:var(--text-muted);font-size:0.88rem;">Select a month and click Load.</p></div>
    </div>
  </div>
</div>
<style>
#qrModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;}
#qrModal.open{display:flex;}
</style>
<div id="qrModal" onclick="if(event.target===this)closeQR()">
  <div style="background:#0e0c14;border:1px solid rgba(59,130,246,0.35);border-radius:20px;padding:28px 24px;width:min(340px,92vw);text-align:center;position:relative;">
    <button onclick="closeQR()" style="position:absolute;top:14px;right:16px;background:none;border:none;color:rgba(240,230,211,0.4);font-size:1.2rem;cursor:pointer;"><i class="fas fa-times"></i></button>
    <div style="margin-bottom:16px;">
      <div id="qrName" style="font-weight:700;color:#fff;font-size:0.95rem;"></div>
      <div id="qrUpi" style="font-size:0.78rem;color:#9dc0ff;margin-top:4px;"></div>
    </div>
    <img id="qrImg" src="" alt="QR Code" style="width:100%;max-width:260px;border-radius:12px;border:2px solid rgba(59,130,246,0.3);"/>
    <a id="qrDownload" href="" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 20px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:0.82rem;font-weight:700;text-decoration:none;"><i class="fas fa-external-link-alt"></i>Open Full Size</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getAllEmployees, getPayroll, savePayroll, showToast, db } from '../js/firebase.js';
import { getDocs, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../login.html'; }
document.getElementById('adminName').textContent = profile?.full_name || user.email;
document.getElementById('payMonth').value = new Date().toISOString().slice(0,7);

let employees = [];
let currentRows = [];

async function init() {
  try {
    employees = await getAllEmployees(true);
    if (!employees.length) {
      // Try getting all employees (including inactive) as fallback
      employees = await getAllEmployees(false);
    }
  } catch(err) {
    document.getElementById('payrollGrid').innerHTML = `<p style="color:#ff9a9a;"><i class="fas fa-exclamation-circle me-2"></i>Failed to load employees: ${err.message}<br><small style="color:var(--text-muted);">Make sure Firestore rules allow admin to read employees.</small></p>`;
  }
  // Auto-load current month
  loadPayroll();
}
init();

window.loadPayroll = async () => {
  const month = document.getElementById('payMonth').value;
  if (!month) return;
  const grid = document.getElementById('payrollGrid');
  grid.innerHTML = '<div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Calculating…</div>';

  try {
    const [year, mon] = month.split('-').map(Number);
    const daysInMonth = new Date(year, mon, 0).getDate();
    const existing = await getPayroll(month);

    const attSnap = await getDocs(query(collection(db,'attendance'),
      where('date','>=',`${month}-01`), where('date','<=',`${month}-${String(daysInMonth).padStart(2,'0')}`)));
    const allAtt = attSnap.docs.map(d => d.data());

    currentRows = employees.map(emp => {
      const ex = existing.find(p => p.employee_id === emp.id);
      if (ex) return { ...emp, present: ex.present_days, absent: ex.absent_days, net: ex.net_salary, base: ex.base_salary||emp.monthly_salary||0, saved: true, status: ex.status||'Pending', upi_qr: emp.qr_code_url||emp.upi_qr||'', upi_id: emp.upi_id||'' };
      const empAtt = allAtt.filter(r => r.employee_id === emp.id);
      let present = 0;
      empAtt.forEach(r => {
        if (r.status === 'Present') present++;
        else if (r.status === 'Half Day') present += 0.5;
      });
      const net = Math.round(((emp.monthly_salary || 0) / daysInMonth) * present);
      return { ...emp, present, absent: daysInMonth - present, net, base: emp.monthly_salary||0, saved: false, status: 'Pending', upi_qr: emp.qr_code_url||emp.upi_qr||'', upi_id: emp.upi_id||'' };
    });

    if (!currentRows.length) { grid.innerHTML = '<div class="text-center py-5"><i class="fas fa-users" style="font-size:2rem;color:rgba(201,168,76,0.2);"></i><p class="mt-3" style="color:var(--text-muted);">No employees found. Add employees first from the Employees page.</p></div>'; return; }

    grid.innerHTML = `
    <div class="table-responsive">
      <table class="admin-table">
        <thead><tr><th>Employee</th><th>Role</th><th>Base Salary</th><th>Present Days</th><th>Net Pay</th><th>Bonus</th><th>Pay QR</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${currentRows.map(r => `<tr>
          <td class="admin-td-bold">${r.full_name}</td>
          <td class="admin-td-muted">${r.role}</td>
          <td style="color:var(--gold-2);font-weight:700;">₹${Math.round(r.monthly_salary||0).toLocaleString()}</td>
          <td class="admin-td-muted">
            ${r.saved ? `${r.present} / ${daysInMonth}` : `<input type="number" class="present-input" data-id="${r.id}" value="${r.present}" min="0" max="${daysInMonth}" step="0.5" style="width:70px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.85rem;" onchange="recalcRow('${r.id}',${daysInMonth},${r.monthly_salary||0})"/>`}
          </td>
          <td style="color:#7ce0aa;font-weight:700;font-size:1rem;" id="net-${r.id}">₹${r.net.toLocaleString()}</td>
          <td><input type="number" class="bonus-input" data-id="${r.id}" value="${r.bonus||0}" min="0" style="width:80px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,168,76,0.2);color:#7ce0aa;outline:none;font-size:0.85rem;" ${r.saved?'disabled':''}/></td>
          <td>${(r.upi_qr || r.upi_id) ? `<button onclick="showQR('${r.upi_qr || `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(r.upi_id||'')}`}','${r.full_name}','${r.upi_id||''}')" style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;"><i class="fas fa-qrcode"></i> View QR</button>` : '<span style="color:rgba(240,230,211,0.2);font-size:0.75rem;">—</span>'}</td>
          <td id="status-${r.id}"><span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;${(r.status||'Pending')==='Paid'?'background:rgba(37,211,102,0.16);color:#7ce0aa;':'background:rgba(255,170,77,0.16);color:#ffc36b;'}">${r.status||'Pending'}</span></td>
          <td>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              ${r.saved
                ? `<button class="btn-gold save-pay-btn" data-id="${r.id}" data-month="${month}" data-present="${r.present}" data-absent="${Math.round(daysInMonth-r.present)}" data-net="${r.net}" data-base="${r.base}" style="padding:3px 10px;font-size:0.72rem;"><i class="fas fa-redo me-1"></i>Update</button>`
                : `<button class="btn-gold save-pay-btn" data-id="${r.id}" data-month="${month}" data-present="${r.present}" data-absent="${Math.round(daysInMonth-r.present)}" data-net="${r.net}" data-base="${r.base}" style="padding:5px 14px;font-size:0.78rem;"><i class="fas fa-save me-1"></i>Save</button>`}
              ${r.saved && (r.status||'Pending')!=='Paid' ? `<button class="mark-paid-btn" data-id="${r.id}" data-month="${month}" style="padding:5px 12px;border-radius:999px;border:1px solid rgba(37,211,102,0.35);background:rgba(37,211,102,0.1);color:#7ce0aa;font-size:0.72rem;font-weight:700;cursor:pointer;"><i class="fas fa-check me-1"></i>Mark Paid</button>` : ''}
            </div>
          </td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div style="margin-top:16px;padding:12px 16px;border-radius:12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.12);font-size:0.8rem;color:rgba(240,230,211,0.5);">
      <i class="fas fa-info-circle me-2" style="color:var(--gold);"></i>You can manually edit present days and bonus before saving.
    </div>`;
  } catch(err) {
    grid.innerHTML = `<p style="color:#ff9a9a;"><i class="fas fa-exclamation-circle me-2"></i>Error loading payroll: ${err.message}</p>`;
  }
};

window.recalcRow = (empId, daysInMonth, baseSalary) => {
  const presentInput = document.querySelector(`.present-input[data-id="${empId}"]`);
  const present = parseFloat(presentInput?.value || 0);
  const net = Math.round((baseSalary / daysInMonth) * present);
  const netEl = document.getElementById(`net-${empId}`);
  if (netEl) netEl.textContent = `₹${net.toLocaleString()}`;
  // Update data-net on save button
  const saveBtn = document.querySelector(`.save-pay-btn[data-id="${empId}"]`);
  if (saveBtn) { saveBtn.dataset.present = present; saveBtn.dataset.absent = daysInMonth - present; saveBtn.dataset.net = net; }
};

document.addEventListener('click', async e => {
  const paidBtn = e.target.closest('.mark-paid-btn');
  if (paidBtn) {
    paidBtn.disabled = true; paidBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>';
    try {
      const empId = paidBtn.dataset.id;
      const month = paidBtn.dataset.month;
      // Find existing payroll doc and update only status
      const { getDocs: _gd, collection: _col, query: _q, where: _w, updateDoc: _upd, doc: _doc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const snap = await _gd(_q(_col(db, 'payroll'), _w('employee_id','==',empId), _w('month','==',month)));
      if (!snap.empty) await _upd(snap.docs[0].ref, { status: 'Paid' });
      showToast('Marked as Paid!', 'success');
      await loadPayroll();
    } catch(err) { showToast('Failed: ' + err.message, 'danger'); paidBtn.disabled = false; paidBtn.innerHTML = '<i class="fas fa-check me-1"></i>Mark Paid'; }
    return;
  }
  const btn = e.target.closest('.save-pay-btn');
  if (!btn) return;
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Saving…';
  const empId = btn.dataset.id;
  const row = currentRows.find(r => r.id === empId);
  const month = btn.dataset.month;
  // Read live values from inputs if available
  const presentInput = document.querySelector(`.present-input[data-id="${empId}"]`);
  const bonusInput = document.querySelector(`.bonus-input[data-id="${empId}"]`);
  const present = parseFloat(presentInput?.value ?? btn.dataset.present);
  const bonus = parseFloat(bonusInput?.value || 0);
  const base = parseFloat(btn.dataset.base) || 0;
  const [yr2, mn2] = month.split('-').map(Number);
  const dim = new Date(yr2, mn2, 0).getDate();
  const net = Math.round((base / dim) * present) + bonus;
  const absent = parseFloat(btn.dataset.absent);
  try {
    await savePayroll({ employee_id: empId, employee_name: row?.full_name||'', month, present_days: present, absent_days: absent, net_salary: net, base_salary: base, bonus, deductions: 0, status: 'Pending' });
    showToast('Payroll saved!', 'success');
    await loadPayroll();
  } catch(err) { showToast('Failed to save payroll: ' + err.message, 'danger'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-1"></i>Save'; }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
window.closeQR = () => document.getElementById('qrModal').classList.remove('open');
window.showQR = (url, name, upi) => {
  document.getElementById('qrImg').src = url;
  document.getElementById('qrName').textContent = name;
  document.getElementById('qrUpi').textContent = upi || '';
  document.getElementById('qrDownload').href = url;
  document.getElementById('qrModal').classList.add('open');
};
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
