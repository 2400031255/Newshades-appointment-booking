</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Payroll</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="admin-card mb-4">
      <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
        <h6 class="fw-bold mb-0" style="color:#fff;">Monthly Payroll</h6>
        <input type="month" id="payMonth" style="padding:8px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;color-scheme:dark;"/>
        <button onclick="loadPayroll()" class="btn-gold" style="padding:8px 20px;"><i class="fas fa-search me-2"></i>Load</button>
      </div>
      <div id="payrollGrid"><p style="color:var(--text-muted);font-size:0.88rem;">Select a month and click Load.</p></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getAllEmployees, getPayroll, savePayroll, showToast, db } from '../js/firebase.js';
import { getDocs, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../login.html'; }
document.getElementById('adminName').textContent = profile?.full_name || user.email;
document.getElementById('payMonth').value = new Date().toISOString().slice(0,7);

let employees = await getAllEmployees(true);

window.loadPayroll = async () => {
  const month = document.getElementById('payMonth').value;
  if (!month) return;
  const grid = document.getElementById('payrollGrid');
  grid.innerHTML = '<div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Calculating…</div>';

  const [year, mon] = month.split('-').map(Number);
  const daysInMonth = new Date(year, mon, 0).getDate();
  const existing = await getPayroll(month);

  // Bulk fetch ALL attendance for this month in ONE query
  const attSnap = await getDocs(query(collection(db,'attendance'),
    where('date','>=',`${month}-01`), where('date','<=',`${month}-${daysInMonth}`)));
  const allAtt = attSnap.docs.map(d => d.data());

  const rows = employees.map(emp => {
    const ex = existing.find(p => p.employee_id === emp.id);
    if (ex) return { ...emp, present: ex.present_days, absent: ex.absent_days, net: ex.net_salary, saved: true };
    const empAtt = allAtt.filter(r => r.employee_id === emp.id);
    let present = 0;
    empAtt.forEach(r => {
      if (r.status === 'Present') present++;
      else if (r.status === 'Half Day') present += 0.5;
    });
    const workDays = emp.working_days_per_month || 26;
    const net = Math.round(((emp.monthly_salary || 0) / workDays) * present);
    return { ...emp, present, absent: daysInMonth - present, net, saved: false };
  });

  if (!rows.length) { grid.innerHTML = '<p style="color:var(--text-muted);">No active employees found.</p>'; return; }

  grid.innerHTML = `
  <div class="table-responsive">
    <table class="admin-table">
      <thead><tr><th>Employee</th><th>Role</th><th>Monthly Salary</th><th>Present</th><th>Net Salary</th><th>UPI</th><th>Action</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td class="admin-td-bold">${r.full_name}</td>
        <td class="admin-td-muted">${r.role}</td>
        <td style="color:var(--gold-2);font-weight:700;">₹${Math.round(r.monthly_salary||0).toLocaleString()}</td>
        <td class="admin-td-muted">${r.present} / ${daysInMonth} days</td>
        <td style="color:#7ce0aa;font-weight:700;font-size:1rem;">₹${r.net.toLocaleString()}</td>
        <td>${r.upi_id
          ? `<div style="font-size:0.78rem;"><div style="color:#9dc0ff;font-weight:600;">${r.upi_id}</div>${r.upi_app?`<div style="color:var(--text-muted);font-size:0.7rem;">${r.upi_app}</div>`:''}</div>`
          : '<span style="color:rgba(240,230,211,0.25);font-size:0.75rem;">Not set</span>'}
        </td>
        <td>${r.saved
          ? '<span style="color:#7ce0aa;font-size:0.8rem;"><i class="fas fa-check-circle me-1"></i>Saved</span>'
          : `<button class="btn-gold save-pay-btn" data-id="${r.id}" data-month="${month}" data-present="${r.present}" data-absent="${Math.round(daysInMonth-r.present)}" data-net="${r.net}" data-base="${r.monthly_salary||0}" style="padding:5px 14px;font-size:0.78rem;"><i class="fas fa-save me-1"></i>Save</button>`}
        </td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
};

document.addEventListener('click', async e => {
  const btn = e.target.closest('.save-pay-btn');
  if (!btn) return;
  const empId = btn.dataset.id;
  const emp = rows.find(r => r.id === empId);
  const { month, present, absent, net, base } = btn.dataset;
  await savePay(empId, emp?.full_name||'', month, parseFloat(present), parseFloat(absent), parseFloat(net), parseFloat(base));
});

window.savePay = async (empId, empName, month, present, absent, net, base) => {
  try {
    await savePayroll({ employee_id: empId, employee_name: empName, month, present_days: present, absent_days: absent, net_salary: net, base_salary: base||0, bonus: 0, deductions: 0, status: 'Pending' });
    showToast('Payroll saved!', 'success');
    await loadPayroll();
  } catch { showToast('Failed to save payroll.', 'danger'); }
};

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
