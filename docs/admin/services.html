<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Services – New Shades Admin</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Admin Panel</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="services.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-concierge-bell"></i> Services</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> Enquiries</span></a>
    <a href="customers.html"><span class="sidebar-nav-label"><i class="fas fa-users"></i> Customers</span></a>
    <a href="employees.html"><span class="sidebar-nav-label"><i class="fas fa-user-tie"></i> Employees</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> Attendance</span></a>
    <a href="payroll.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> Payroll</span></a>
    <a href="leave_requests.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="offers.html"><span class="sidebar-nav-label"><i class="fas fa-fire" style="color:#ff9500;"></i> Offers</span></a>
    <a href="settings.html"><span class="sidebar-nav-label"><i class="fab fa-whatsapp" style="color:#25d366;"></i> Settings</span></a>
    <a href="gallery.html"><span class="sidebar-nav-label"><i class="fas fa-images"></i> Gallery</span></a>
    <a href="reviews.html"><span class="sidebar-nav-label"><i class="fas fa-star"></i> Reviews</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Manage Services</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">
      <!-- Add/Edit Form -->
      <div class="col-lg-4">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;" id="formTitle"><i class="fas fa-plus me-2" style="color:var(--gold);"></i>Add Service</h6>
          <form id="svcForm">
            <input type="hidden" id="editId"/>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">SERVICE NAME *</label><input type="text" id="svcName" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. Hair Cut"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">CATEGORY</label><select id="svcCat" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;cursor:pointer;"><option>Hair</option><option>Beard</option><option>Skin</option><option>Wellness</option><option>Nails</option><option>Bridal</option><option>Other</option></select></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">PRICE (₹)</label><input type="number" id="svcPrice" min="0" step="0.01" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. 250"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">DURATION</label><input type="text" id="svcDur" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. 30 mins"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">DESCRIPTION</label><textarea id="svcDesc" rows="3" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;resize:vertical;font-family:'DM Sans',sans-serif;" placeholder="Short description…"></textarea></div>
            <div class="mb-4 d-flex align-items-center gap-2"><input type="checkbox" id="svcActive" checked style="accent-color:#D4AF37;width:16px;height:16px;"/><label for="svcActive" style="color:rgba(240,230,211,0.7);font-size:0.88rem;cursor:pointer;">Active (visible to customers)</label></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn-gold" style="flex:1;justify-content:center;" id="svcSubmitBtn"><i class="fas fa-plus me-2"></i>Add Service</button>
              <button type="button" id="cancelEditBtn" style="display:none;flex:1;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(240,230,211,0.8);font-weight:700;cursor:pointer;" onclick="cancelEdit()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      <!-- Services List -->
      <div class="col-lg-8">
        <div class="admin-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h6 class="fw-bold mb-0" style="color:#fff;">All Services <span style="color:var(--gold);" id="svcCount"></span></h6>
            <input type="text" placeholder="Search…" style="padding:7px 12px;border-radius:999px;border:1px solid rgba(201,168,76,0.24);background:rgba(255,255,255,0.06);color:#fff;outline:none;font-size:0.85rem;width:180px;" oninput="filterSvcs(this.value)"/>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Service</th><th>Category</th><th>Price</th><th>Duration</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="svcBody"><tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getServices, createService, updateService, deleteService, showToast } from '../js/firebase.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../customer/dashboard.html'; }
document.getElementById('adminName').textContent = profile?.full_name || user.email;

let allSvcs = [];

async function loadSvcs() {
  allSvcs = await getServices();
  renderSvcs(allSvcs);
}
loadSvcs();

function renderSvcs(svcs) {
  document.getElementById('svcCount').textContent = `(${svcs.length})`;
  document.getElementById('svcBody').innerHTML = svcs.map(s => `<tr>
    <td><div class="admin-td-bold">${s.service_name}</div><div style="font-size:0.8rem;color:var(--text-muted);">${(s.description||'').slice(0,50)}${(s.description||'').length>50?'…':''}</div></td>
    <td><span class="admin-badge">${s.category||'—'}</span></td>
    <td style="color:var(--gold-2);font-weight:700;">${s.price_on_request?'<span style="color:#7ce0aa;font-size:0.82rem;">At Salon</span>':'₹'+Math.round(s.price||0)}</td>
    <td class="admin-td-muted">${s.duration||'—'}</td>
    <td><span class="admin-status-badge ${s.is_active?'badge-status-confirmed':'badge-status-cancelled'}">${s.is_active?'Active':'Inactive'}</span></td>
    <td><div class="d-flex gap-2"><button class="admin-action-btn" onclick="editSvc('${s.id}')"><i class="fas fa-edit"></i></button><button class="admin-action-btn admin-action-danger" onclick="delSvc('${s.id}')"><i class="fas fa-trash"></i></button></div></td>
  </tr>`).join('') || '<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No services yet.</td></tr>';
}

window.filterSvcs = q => { q=q.toLowerCase(); renderSvcs(allSvcs.filter(s=>(s.service_name||'').toLowerCase().includes(q)||(s.category||'').toLowerCase().includes(q))); };

document.getElementById('svcForm').addEventListener('submit', async e => {
  e.preventDefault();
  const eid = document.getElementById('editId').value;
  const data = { service_name: document.getElementById('svcName').value.trim(), category: document.getElementById('svcCat').value, price: parseFloat(document.getElementById('svcPrice').value)||0, duration: document.getElementById('svcDur').value.trim(), description: document.getElementById('svcDesc').value.trim(), is_active: document.getElementById('svcActive').checked?1:0 };
  try {
    if (eid) { await updateService(eid, data); showToast('Service updated!', 'success'); }
    else { await createService(data); showToast('Service added!', 'success'); }
    cancelEdit(); await loadSvcs();
  } catch(err) { showToast('Failed to save.', 'danger'); }
});

window.editSvc = (id) => {
  const s = allSvcs.find(x => x.id === id); if (!s) return;
  document.getElementById('editId').value = id;
  document.getElementById('svcName').value = s.service_name||'';
  document.getElementById('svcCat').value = s.category||'Hair';
  document.getElementById('svcPrice').value = s.price||'';
  document.getElementById('svcDur').value = s.duration||'';
  document.getElementById('svcDesc').value = s.description||'';
  document.getElementById('svcActive').checked = !!s.is_active;
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-2" style="color:var(--gold);"></i>Edit Service';
  document.getElementById('svcSubmitBtn').innerHTML = '<i class="fas fa-save me-2"></i>Save Changes';
  document.getElementById('cancelEditBtn').style.display = '';
};

window.cancelEdit = () => {
  document.getElementById('editId').value = '';
  document.getElementById('svcForm').reset();
  document.getElementById('svcActive').checked = true;
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus me-2" style="color:var(--gold);"></i>Add Service';
  document.getElementById('svcSubmitBtn').innerHTML = '<i class="fas fa-plus me-2"></i>Add Service';
  document.getElementById('cancelEditBtn').style.display = 'none';
};

window.delSvc = async (id) => {
  if (!confirm('Delete this service?')) return;
  try { await deleteService(id); allSvcs = allSvcs.filter(s => s.id !== id); renderSvcs(allSvcs); showToast('Deleted.', 'success'); }
  catch(err) { showToast('Failed to delete.', 'danger'); }
};

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'), overlay=document.getElementById('sidebarOverlay'), toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
