<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery – New Shades Admin</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Admin Panel</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="services.html"><span class="sidebar-nav-label"><i class="fas fa-concierge-bell"></i> Services</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> Enquiries</span></a>
    <a href="employees.html"><span class="sidebar-nav-label"><i class="fas fa-user-tie"></i> Employees</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> Attendance</span></a>
    <a href="payroll.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> Payroll</span></a>
    <a href="leave_requests.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="settings.html"><span class="sidebar-nav-label"><i class="fab fa-whatsapp" style="color:#25d366;"></i> Settings</span></a>
    <a href="gallery.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-images"></i> Gallery</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Manage Gallery</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">
      <!-- Add Photo Form -->
      <div class="col-lg-4">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-images me-2" style="color:var(--gold);"></i>Add Photo</h6>
          <form id="galleryForm">
            <div id="dropZone" onclick="document.getElementById('fileInput').click()" style="border:2px dashed rgba(201,168,76,0.3);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin-bottom:12px;">
              <i class="fas fa-cloud-upload-alt" style="font-size:2rem;color:rgba(201,168,76,0.4);margin-bottom:8px;display:block;"></i>
              <div style="font-size:0.85rem;color:rgba(240,230,211,0.6);">Click or drag &amp; drop photo / video</div>
              <div style="font-size:0.72rem;color:rgba(240,230,211,0.3);margin-top:4px;">JPG, PNG, WEBP, MP4 · from phone or laptop</div>
            </div>
            <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;"/>
            <div id="previewWrap" style="display:none;margin-bottom:12px;">
              <img id="previewImg" style="width:100%;border-radius:12px;max-height:180px;object-fit:cover;display:none;"/>
              <video id="previewVid" style="width:100%;border-radius:12px;max-height:180px;display:none;" controls muted playsinline></video>
              <div id="progressWrap" style="display:none;margin-top:8px;background:rgba(255,255,255,0.06);border-radius:999px;height:6px;overflow:hidden;">
                <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#F5D060,#D4AF37);border-radius:999px;transition:width 0.2s;"></div>
              </div>
              <div id="uploadStatus" style="margin-top:8px;font-size:0.82rem;color:var(--gold-2);"></div>
            </div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">CAPTION</label><input type="text" id="photoCaption" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. Hair Transformation"/></div>
            <div class="mb-4"><label class="field-label mb-1" style="font-size:0.75rem;">CATEGORY</label>
              <select id="photoCategory" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(20,16,10,0.95);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;cursor:pointer;">
                <option>Hair</option><option>Beard</option><option>Skin</option><option>Bridal</option><option>Other</option>
              </select>
            </div>
            <button type="submit" id="addPhotoBtn" class="btn-gold" style="width:100%;justify-content:center;" disabled><i class="fas fa-plus me-2"></i>Add Photo</button>
          </form>
        </div>
      </div>
      <!-- Gallery Grid -->
      <div class="col-lg-8">
        <div class="admin-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h6 class="fw-bold mb-0" style="color:#fff;">All Photos <span style="color:var(--gold);" id="photoCount"></span></h6>
          </div>
          <div class="row g-3" id="galleryGrid"><div class="col-12 text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getGallery, addGalleryPhoto, deleteGalleryPhoto, showToast, uploadFile } from '../js/firebase.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../login.html'; }
document.getElementById('adminName').textContent = profile?.full_name || user.email;

let photos = [], uploadedUrl = '';

// Drag & drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = 'rgba(201,168,76,0.8)'; });
dz.addEventListener('dragleave', () => { dz.style.borderColor = 'rgba(201,168,76,0.3)'; });
dz.addEventListener('drop', e => { e.preventDefault(); dz.style.borderColor = 'rgba(201,168,76,0.3)'; handleFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');
  if (!isImage && !isVideo) { showToast('Please select an image or video.', 'warning'); return; }

  uploadedUrl = '';
  document.getElementById('addPhotoBtn').disabled = true;
  document.getElementById('previewWrap').style.display = '';
  document.getElementById('previewImg').style.display = isImage ? '' : 'none';
  document.getElementById('previewVid').style.display = isVideo ? '' : 'none';

  if (isImage) document.getElementById('previewImg').src = URL.createObjectURL(file);
  if (isVideo) document.getElementById('previewVid').src = URL.createObjectURL(file);

  uploadToStorage(file);
}

async function uploadToStorage(file) {
  const status = document.getElementById('uploadStatus');
  const bar    = document.getElementById('progressBar');
  const barWrap = document.getElementById('progressWrap');
  barWrap.style.display = '';
  status.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Uploading…';

  try {
    const path = `gallery/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    uploadedUrl = await uploadFile(path, file, pct => {
      bar.style.width = pct + '%';
      status.innerHTML = `<i class="fas fa-spinner fa-spin me-1"></i>Uploading… ${pct}%`;
    });
    bar.style.width = '100%';
    status.innerHTML = '<i class="fas fa-check-circle me-1" style="color:#7ce0aa;"></i><span style="color:#7ce0aa;">Upload complete! Ready to add.</span>';
    document.getElementById('addPhotoBtn').disabled = false;
  } catch(err) {
    status.innerHTML = '<i class="fas fa-times-circle me-1" style="color:#ff6b6b;"></i><span style="color:#ff6b6b;">Upload failed. Check Firebase Storage is enabled.</span>';
    barWrap.style.display = 'none';
    console.error(err);
  }
}

async function load() {
  photos = await getGallery();
  document.getElementById('photoCount').textContent = `(${photos.length})`;
  const grid = document.getElementById('galleryGrid');
  if (!photos.length) {
    grid.innerHTML = '<div class="col-12 text-center py-5" style="color:var(--text-muted);"><i class="fas fa-images" style="font-size:2.5rem;opacity:0.2;"></i><p class="mt-3">No photos yet.</p></div>';
    return;
  }
  grid.innerHTML = photos.map(p => `
    <div class="col-md-4 col-6">
      <div style="position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:#111;">
        ${p.type === 'video'
          ? `<video src="${p.url}" style="width:100%;height:100%;object-fit:cover;display:block;" muted playsinline loop autoplay></video>`
          : `<img src="${p.url}" alt="${p.caption||''}" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy"/>`
        }
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;pointer-events:none;">
          <div style="font-size:0.78rem;color:#fff;font-weight:600;">${p.caption||''}</div>
          <div style="font-size:0.7rem;color:var(--gold-2);">${p.category||''}</div>
        </div>
        <button data-id="${p.id}" class="del-btn" style="position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,107,107,0.5);color:#ff6b6b;cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center;"><i class="fas fa-trash"></i></button>
      </div>
    </div>`).join('');
}
load();

document.getElementById('galleryGrid').addEventListener('click', async e => {
  const btn = e.target.closest('.del-btn');
  if (!btn) return;
  if (!confirm('Delete this photo?')) return;
  try { await deleteGalleryPhoto(btn.dataset.id); showToast('Deleted.', 'success'); load(); }
  catch { showToast('Failed to delete.', 'danger'); }
});

document.getElementById('galleryForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!uploadedUrl) { showToast('Please wait for upload to finish.', 'warning'); return; }
  const btn = document.getElementById('addPhotoBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
  try {
    const isVideo = document.getElementById('previewVid').style.display !== 'none';
    await addGalleryPhoto({ url: uploadedUrl, type: isVideo ? 'video' : 'image', caption: document.getElementById('photoCaption').value.trim(), category: document.getElementById('photoCategory').value });
    showToast('Photo added!', 'success');
    e.target.reset();
    uploadedUrl = '';
    document.getElementById('previewWrap').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('uploadStatus').innerHTML = '';
    document.getElementById('fileInput').value = '';
    load();
  } catch { showToast('Failed to save.', 'danger'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus me-2"></i>Add Photo'; }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
