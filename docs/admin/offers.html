<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offers – New Shades Admin</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Admin Panel</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="services.html"><span class="sidebar-nav-label"><i class="fas fa-concierge-bell"></i> Services</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> Enquiries</span></a>
    <a href="customers.html"><span class="sidebar-nav-label"><i class="fas fa-users"></i> Customers</span></a>
    <a href="employees.html"><span class="sidebar-nav-label"><i class="fas fa-user-tie"></i> Employees</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> Attendance</span></a>
    <a href="payroll.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> Payroll</span></a>
    <a href="leave_requests.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="offers.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-fire" style="color:#ff9500;"></i> Offers</span></a>
    <a href="settings.html"><span class="sidebar-nav-label"><i class="fab fa-whatsapp" style="color:#25d366;"></i> Settings</span></a>
    <a href="gallery.html"><span class="sidebar-nav-label"><i class="fas fa-images"></i> Gallery</span></a>
    <a href="reviews.html"><span class="sidebar-nav-label"><i class="fas fa-star"></i> Reviews</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Manage Offers</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">
      <!-- Add/Edit Form -->
      <div class="col-lg-4">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;" id="formTitle"><i class="fas fa-plus me-2" style="color:var(--gold);"></i>Add Offer</h6>
          <form id="offerForm">
            <input type="hidden" id="editId"/>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">TITLE *</label><input type="text" id="offerTitle" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. 20% Off Hair Spa"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">DISCOUNT BADGE TEXT</label><input type="text" id="offerDiscount" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="e.g. 20% OFF"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">DESCRIPTION</label><textarea id="offerDesc" rows="3" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;resize:vertical;font-family:'DM Sans',sans-serif;" placeholder="Offer details…"></textarea></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">VALID FROM</label><input type="date" id="offerFrom" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;color-scheme:dark;"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">VALID UNTIL</label><input type="date" id="offerUntil" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;color-scheme:dark;"/></div>
            <div class="mb-4 d-flex align-items-center gap-2"><input type="checkbox" id="offerActive" checked style="accent-color:#D4AF37;width:16px;height:16px;"/><label for="offerActive" style="color:rgba(240,230,211,0.7);font-size:0.88rem;cursor:pointer;">Active (visible to customers)</label></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn-gold" style="flex:1;justify-content:center;" id="offerSubmitBtn"><i class="fas fa-plus me-2"></i>Add Offer</button>
              <button type="button" id="cancelEditBtn" style="display:none;flex:1;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(240,230,211,0.8);font-weight:700;cursor:pointer;" onclick="cancelEdit()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      <!-- Offers List -->
      <div class="col-lg-8">
        <div class="admin-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h6 class="fw-bold mb-0" style="color:#fff;">All Offers <span style="color:var(--gold);" id="offerCount"></span></h6>
          </div>
          <div id="offersList"><div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getAllOffers, createOffer, updateOffer, deleteOffer, showToast, formatDate } from '../js/firebase.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../login.html'; }
document.getElementById('adminName').textContent = profile?.full_name || user.email;

let allOffers = [];

async function load() {
  allOffers = await getAllOffers();
  allOffers.sort((a,b) => (b.created_at?.seconds||0) - (a.created_at?.seconds||0));
  document.getElementById('offerCount').textContent = `(${allOffers.length})`;
  const today = new Date().toISOString().slice(0,10);
  const list = document.getElementById('offersList');
  if (!allOffers.length) { list.innerHTML = '<div class="text-center py-5" style="color:var(--text-muted);"><i class="fas fa-fire" style="font-size:2.5rem;opacity:0.2;"></i><p class="mt-3">No offers yet. Add one!</p></div>'; return; }
  list.innerHTML = allOffers.map(o => {
    const isActive = o.is_active && (!o.valid_from || o.valid_from <= today) && (!o.valid_until || o.valid_until >= today);
    return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,${isActive?'0.28':'0.08'});border-radius:16px;padding:18px 20px;margin-bottom:12px;">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;color:#fff;font-size:0.95rem;margin-bottom:4px;">${o.title}${o.discount_text?`<span style="margin-left:8px;padding:2px 10px;border-radius:999px;font-size:0.7rem;font-weight:900;background:linear-gradient(135deg,rgba(201,168,76,0.3),rgba(201,168,76,0.15));color:var(--gold-2);border:1px solid rgba(201,168,76,0.3);">${o.discount_text}</span>`:''}</div>
          ${o.description?`<div style="font-size:0.82rem;color:rgba(240,230,211,0.55);margin-bottom:6px;">${o.description}</div>`:''}
          <div style="font-size:0.75rem;color:rgba(240,230,211,0.4);">${o.valid_from?`From: ${o.valid_from}`:''}${o.valid_from&&o.valid_until?' · ':''}${o.valid_until?`Until: ${o.valid_until}`:''}</div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <span style="padding:3px 12px;border-radius:999px;font-size:0.7rem;font-weight:700;${isActive?'background:rgba(37,211,102,0.12);color:#7ce0aa;border:1px solid rgba(37,211,102,0.2);':'background:rgba(150,150,150,0.12);color:rgba(240,230,211,0.4);border:1px solid rgba(150,150,150,0.15);'}">${isActive?'Active':'Inactive'}</span>
          <button onclick="editOffer('${o.id}')" style="padding:5px 12px;border-radius:999px;border:1px solid rgba(105,152,255,0.3);background:rgba(105,152,255,0.08);color:#9dc0ff;font-size:0.72rem;font-weight:700;cursor:pointer;"><i class="fas fa-edit me-1"></i>Edit</button>
          <button onclick="delOffer('${o.id}')" style="padding:5px 12px;border-radius:999px;border:1px solid rgba(226,93,93,0.2);background:rgba(226,93,93,0.06);color:rgba(255,154,154,0.6);font-size:0.72rem;font-weight:700;cursor:pointer;"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
}
load();

document.getElementById('offerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const eid = document.getElementById('editId').value;
  const data = {
    title: document.getElementById('offerTitle').value.trim(),
    discount_text: document.getElementById('offerDiscount').value.trim(),
    description: document.getElementById('offerDesc').value.trim(),
    valid_from: document.getElementById('offerFrom').value || null,
    valid_until: document.getElementById('offerUntil').value || null,
    is_active: document.getElementById('offerActive').checked ? 1 : 0
  };
  try {
    if (eid) { await updateOffer(eid, data); showToast('Offer updated!', 'success'); }
    else { await createOffer(data); showToast('Offer added!', 'success'); }
    cancelEdit(); await load();
  } catch { showToast('Failed to save.', 'danger'); }
});

window.editOffer = (id) => {
  const o = allOffers.find(x => x.id === id); if (!o) return;
  document.getElementById('editId').value = id;
  document.getElementById('offerTitle').value = o.title||'';
  document.getElementById('offerDiscount').value = o.discount_text||'';
  document.getElementById('offerDesc').value = o.description||'';
  document.getElementById('offerFrom').value = o.valid_from||'';
  document.getElementById('offerUntil').value = o.valid_until||'';
  document.getElementById('offerActive').checked = !!o.is_active;
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-2" style="color:var(--gold);"></i>Edit Offer';
  document.getElementById('offerSubmitBtn').innerHTML = '<i class="fas fa-save me-2"></i>Save Changes';
  document.getElementById('cancelEditBtn').style.display = '';
};

window.cancelEdit = () => {
  document.getElementById('editId').value = '';
  document.getElementById('offerForm').reset();
  document.getElementById('offerActive').checked = true;
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus me-2" style="color:var(--gold);"></i>Add Offer';
  document.getElementById('offerSubmitBtn').innerHTML = '<i class="fas fa-plus me-2"></i>Add Offer';
  document.getElementById('cancelEditBtn').style.display = 'none';
};

window.delOffer = async (id) => {
  if (!confirm('Delete this offer?')) return;
  try { await deleteOffer(id); allOffers = allOffers.filter(o => o.id !== id); await load(); showToast('Deleted.', 'success'); }
  catch { showToast('Failed to delete.', 'danger'); }
};

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
