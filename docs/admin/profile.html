<head>

  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>

<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Admin Panel</small></div></div>
  <nav class="sidebar-nav">

    <a href="billing.html"><span class="sidebar-nav-label"><i class="fas fa-file-invoice-dollar" style="color:var(--gold);"></i> Billing</span></a>
    <a href="services.html"><span class="sidebar-nav-label"><i class="fas fa-concierge-bell"></i> Services</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> Enquiries</span></a>

    <a href="attendance.html#monthly-report" class="admin-only-link"><span class="sidebar-nav-label" style="padding-left:18px;font-size:0.8rem;"><i class="fas fa-chart-bar" style="color:var(--gold);"></i> Monthly Report</span></a>
    <a href="payroll.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> Payroll</span></a>
    <a href="leave_requests.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="settings.html"><span class="sidebar-nav-label"><i class="fab fa-whatsapp" style="color:#25d366;"></i> Settings</span></a>
    <a href="gallery.html"><span class="sidebar-nav-label"><i class="fas fa-images"></i> Gallery</span></a>
    <a href="profile.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Profile</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="adminName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4 justify-content-center">

      <!-- Avatar Card -->
      <div class="col-lg-3 col-md-4">
        <div class="admin-card text-center" style="padding:32px 20px;">
          <div id="avatarCircle" style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:#120e08;margin:0 auto 16px;box-shadow:0 12px 32px rgba(201,168,76,0.35);">A</div>
          <div style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:#fff;" id="cardName">—</div>
          <div style="font-size:0.78rem;color:var(--gold-2);margin-top:4px;">Administrator</div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:6px;" id="cardEmail">—</div>
        </div>
      </div>

      <!-- Edit Info -->
      <div class="col-lg-5 col-md-8">
        <div class="admin-card mb-4">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-edit me-2" style="color:var(--gold);"></i>Edit Information</h6>
          <div id="infoAlert"></div>
          <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">FULL NAME</label><input type="text" id="editName" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/></div>
          <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">PHONE</label><input type="tel" id="editPhone" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="+91 XXXXX XXXXX"/></div>
          <div class="mb-4"><label class="field-label mb-1" style="font-size:0.75rem;">EMAIL <span style="color:rgba(240,230,211,0.3);font-size:0.7rem;">(cannot change)</span></label><input type="email" id="editEmail" disabled style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.06);color:rgba(240,230,211,0.4);outline:none;font-size:0.9rem;cursor:not-allowed;"/></div>
          <button id="saveInfoBtn" class="btn-gold" style="width:100%;justify-content:center;"><i class="fas fa-save me-2"></i>Save Changes</button>
        </div>

        <!-- Change Password -->
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-lock me-2" style="color:var(--gold);"></i>Change Password</h6>
          <div id="pwAlert"></div>
          <div class="mb-3">
            <label class="field-label mb-1" style="font-size:0.75rem;">CURRENT PASSWORD</label>
            <div style="position:relative;">
              <input type="password" id="currentPw" style="width:100%;padding:11px 44px 11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Current password"/>
              <button type="button" onclick="toggleField('currentPw','eyeCur')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;"><i class="fas fa-eye" id="eyeCur"></i></button>
            </div>
          </div>
          <div class="mb-3">
            <label class="field-label mb-1" style="font-size:0.75rem;">NEW PASSWORD</label>
            <div style="position:relative;">
              <input type="password" id="newPw" style="width:100%;padding:11px 44px 11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Min 6 characters"/>
              <button type="button" onclick="toggleField('newPw','eyeNew')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;"><i class="fas fa-eye" id="eyeNew"></i></button>
            </div>
          </div>
          <div class="mb-4">
            <label class="field-label mb-1" style="font-size:0.75rem;">CONFIRM NEW PASSWORD</label>
            <input type="password" id="confirmPw" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Repeat new password"/>
          </div>
          <button id="changePwBtn" class="btn-gold" style="width:100%;justify-content:center;background:linear-gradient(135deg,#6f42c1,#4a2d8a);box-shadow:0 8px 24px rgba(111,66,193,0.3);"><i class="fas fa-key me-2"></i>Change Password</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, updateUserProfile, showToast, auth } from '../js/firebase.js';
import { updatePassword, reauthenticateWithCredential, EmailAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (!profile?.is_admin) { window.location.href = '../login.html'; }

const name = profile?.full_name || user.email;
document.getElementById('adminName').textContent = name;
document.getElementById('cardName').textContent = name;
document.getElementById('cardEmail').textContent = user.email;
document.getElementById('avatarCircle').textContent = name[0].toUpperCase();
document.getElementById('editName').value  = profile?.full_name || '';
document.getElementById('editPhone').value = profile?.phone || '';
document.getElementById('editEmail').value = user.email;

function flash(elId, msg, type='danger') {
  const colors = { danger:'rgba(226,93,93,0.12)|rgba(226,93,93,0.28)|#ff9a9a', success:'rgba(37,211,102,0.1)|rgba(37,211,102,0.28)|#7ce0aa' };
  const [bg,border,color] = colors[type].split('|');
  document.getElementById(elId).innerHTML = `<div style="padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:0.84rem;background:${bg};border:1px solid ${border};color:${color};display:flex;align-items:center;gap:8px;"><i class="fas fa-${type==='success'?'check':'exclamation'}-circle"></i>${msg}</div>`;
}

document.getElementById('saveInfoBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveInfoBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
  try {
    const newName = document.getElementById('editName').value.trim();
    await updateUserProfile(user.uid, { full_name: newName, phone: document.getElementById('editPhone').value.trim() });
    document.getElementById('cardName').textContent = newName;
    document.getElementById('avatarCircle').textContent = newName[0]?.toUpperCase() || 'A';
    flash('infoAlert', 'Profile updated successfully!', 'success');
  } catch { flash('infoAlert', 'Failed to update profile.'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Changes'; }
});

document.getElementById('changePwBtn').addEventListener('click', async () => {
  const cur = document.getElementById('currentPw').value;
  const nw  = document.getElementById('newPw').value;
  const cf  = document.getElementById('confirmPw').value;
  if (!cur || !nw) { flash('pwAlert','Fill in all password fields.'); return; }
  if (nw.length < 6) { flash('pwAlert','New password must be at least 6 characters.'); return; }
  if (nw !== cf) { flash('pwAlert','New passwords do not match.'); return; }
  const btn = document.getElementById('changePwBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating…';
  try {
    const cred = EmailAuthProvider.credential(user.email, cur);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, nw);
    flash('pwAlert','Password changed successfully!','success');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
  } catch(err) {
    flash('pwAlert', err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
      ? 'Current password is incorrect.' : err.message);
  } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-key me-2"></i>Change Password'; }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
<script>
function toggleField(id, iconId) {
  const inp = document.getElementById(id);
  const ico = document.getElementById(iconId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
</body>
</html>
