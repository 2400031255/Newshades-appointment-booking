<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billing - New Shades Receptionist</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div style="min-height:100vh;background:#000;">
  <div style="position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,175,55,0.15);">
    <div class="d-flex align-items-center gap-3">
      <img src="../images/logo.jpeg" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid rgba(212,175,55,0.3);"/>
      <div>
        <div style="font-weight:700;color:#fff;font-size:0.95rem;">New Shades</div>
        <div style="font-size:0.7rem;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;">Receptionist</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span id="recepName" style="font-size:0.85rem;color:rgba(255,255,255,0.5);"></span>
      <button id="logoutBtn" style="padding:7px 16px;border-radius:999px;background:rgba(255,100,100,0.1);border:1px solid rgba(255,100,100,0.2);color:#ff9a9a;font-size:0.82rem;cursor:pointer;"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
    </div>
  </div>
  <div style="max-width:900px;margin:0 auto;padding:28px 16px;">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;"><i class="fas fa-receipt me-2" style="color:var(--gold);"></i>New Bill</h6>
          <div class="mb-4">
            <label class="field-label mb-2">CUSTOMER PHONE</label>
            <div class="d-flex gap-2">
              <input type="tel" id="custPhone" maxlength="10" placeholder="10-digit phone" style="flex:1;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.25);color:#fff;outline:none;font-size:0.95rem;"/>
              <button class="btn-gold" style="padding:10px 18px;border-radius:12px;" onclick="searchCustomer()"><i class="fas fa-search me-1"></i>Find</button>
            </div>
            <div id="custInfo" style="display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(37,211,102,0.07);border:1px solid rgba(37,211,102,0.2);">
              <div class="d-flex align-items-center gap-3">
                <div id="custAvatar" style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#F5D060,#D4AF37);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0d0d12;font-size:0.95rem;flex-shrink:0;"></div>
                <div><div id="custName" style="font-weight:700;color:#fff;"></div><div id="custVisits" style="font-size:0.78rem;color:rgba(255,255,255,0.4);"></div></div>
              </div>
            </div>
            <div id="newCustForm" style="display:none;margin-top:10px;">
              <input type="text" id="newCustName" placeholder="Customer name (new)" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,170,77,0.3);color:#fff;outline:none;font-size:0.9rem;"/>
              <div style="font-size:0.75rem;color:#ffc36b;margin-top:5px;">New customer will be created</div>
            </div>
          </div>
          <div class="mb-4">
            <label class="field-label mb-2">SERVICES</label>
            <input type="text" id="svcSearch" placeholder="Search services..." oninput="filterSvcs()" style="width:100%;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;outline:none;font-size:0.88rem;margin-bottom:10px;"/>
            <div id="catTabs" class="d-flex gap-2 flex-wrap mb-3"></div>
            <div id="svcGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:260px;overflow-y:auto;"></div>
          </div>
          <div id="selectedWrap" style="display:none;margin-bottom:16px;">
            <label class="field-label mb-2">SELECTED</label>
            <div id="selectedList"></div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="field-label mb-2">DISCOUNT %</label>
              <input type="number" id="discountPct" min="0" max="100" placeholder="0" oninput="calcTotal()" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.95rem;"/>
            </div>
            <div class="col-6">
              <label class="field-label mb-2">PAYMENT</label>
              <select id="payMethod" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.95rem;cursor:pointer;">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
                <option value="Online">Online</option>
              </select>
            </div>
          </div>
          <button class="btn-gold w-100" style="padding:14px;border-radius:12px;font-size:1rem;justify-content:center;" onclick="saveBill()"><i class="fas fa-check-circle me-2"></i>Generate Bill</button>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="admin-card" style="position:sticky;top:80px;">
          <h6 class="fw-bold mb-3" style="color:#fff;"><i class="fas fa-calculator me-2" style="color:var(--gold);"></i>Summary</h6>
          <div id="summaryItems" style="min-height:80px;margin-bottom:16px;"><div style="color:rgba(255,255,255,0.3);font-size:0.88rem;text-align:center;padding:24px 0;">No services selected</div></div>
          <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:14px;">
            <div class="d-flex justify-content-between mb-2" style="font-size:0.9rem;color:rgba(255,255,255,0.6);"><span>Subtotal</span><span id="subtotalAmt">0</span></div>
            <div class="d-flex justify-content-between mb-2" id="discountRow" style="font-size:0.9rem;color:#ffc36b;display:none;"><span>Discount</span><span id="discountAmt">-0</span></div>
            <div class="d-flex justify-content-between" style="font-size:1.1rem;font-weight:700;color:#fff;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;margin-top:8px;"><span>Total</span><span id="totalAmt" style="color:var(--gold-2);">0</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="receiptModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;width:min(100%,360px);margin:16px;max-height:90vh;overflow-y:auto;">
    <div id="receiptContent"></div>
    <div class="d-flex gap-2 p-3" style="border-top:1px solid #eee;">
      <button onclick="window.print()" style="flex:1;padding:10px;border-radius:10px;background:#3d1a3a;color:#fff;border:none;cursor:pointer;font-weight:600;">Print</button>
      <button onclick="document.getElementById('receiptModal').style.display='none'" style="flex:1;padding:10px;border-radius:10px;background:#f5f5f5;color:#333;border:none;cursor:pointer;">Close</button>
    </div>
  </div>
</div>

<style>
.svc-grid-card{padding:10px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);cursor:pointer;transition:all 0.15s;}
.svc-grid-card:hover{border-color:rgba(212,175,55,0.4);background:rgba(212,175,55,0.06);}
.svc-grid-card.selected{border-color:rgba(212,175,55,0.8);background:rgba(212,175,55,0.1);}
.svc-grid-name{font-size:0.82rem;font-weight:600;color:#fff;margin-bottom:3px;}
.svc-grid-price{font-size:0.78rem;color:var(--gold-2);font-weight:700;}
.cat-tab{padding:5px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:0.78rem;cursor:pointer;transition:all 0.15s;}
.cat-tab.active{background:rgba(212,175,55,0.15);border-color:rgba(212,175,55,0.4);color:var(--gold-2);}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;}
@media print{body *{visibility:hidden;}#receiptContent,#receiptContent *{visibility:visible;}#receiptContent{position:fixed;top:0;left:0;width:80mm;}}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getEmployeeProfile, getServices, showToast, esc } from '../js/firebase.js';
import { createBill, findCustomerByPhone, createBillingCustomer, updateBillingCustomer } from '../js/billing.js';

const user = await requireAuth('../login.html');
const [profile, emp] = await Promise.all([getUserProfile(user.uid), getEmployeeProfile(user.uid)]);
if (!profile && !emp) { window.location.href = '../login.html'; }
document.getElementById('recepName').textContent = (profile || emp)?.full_name || user.email;
document.getElementById('logoutBtn').addEventListener('click', () => logoutUser());

let allSvcs = [], sel = {}, activeCat = 'all', custId = null, custName = '', custVisits = 0;

const svcs = await getServices(true);
allSvcs = svcs;
renderCats(); renderGrid();

function renderCats() {
  const cats = ['all', ...new Set(allSvcs.map(s => s.category).filter(Boolean))].sort();
  document.getElementById('catTabs').innerHTML = cats.map(c =>
    '<button class="cat-tab' + (c==='all'?' active':'') + '" onclick="setCat(' + JSON.stringify(c) + ',this)">' + (c==='all'?'All':esc(c)) + '</button>'
  ).join('');
}

window.setCat = (cat, btn) => {
  activeCat = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
};

function renderGrid() {
  const q = (document.getElementById('svcSearch').value || '').toLowerCase();
  const list = allSvcs.filter(s => (activeCat==='all'||s.category===activeCat) && (!q||s.name.toLowerCase().includes(q)));
  document.getElementById('svcGrid').innerHTML = list.map(s =>
    '<div class="svc-grid-card' + (sel[s.id]?' selected':'') + '" onclick="toggleSvc(' + JSON.stringify(s.id) + ',' + JSON.stringify(s.name) + ',' + s.price + ')">' +
    '<div class="svc-grid-name">' + esc(s.name) + '</div>' +
    '<div class="svc-grid-price">&#8377;' + s.price + '</div></div>'
  ).join('') || '<div style="color:rgba(255,255,255,0.3);font-size:0.85rem;padding:16px;text-align:center;">No services</div>';
}

window.filterSvcs = renderGrid;

window.toggleSvc = (id, name, price) => {
  if (sel[id]) delete sel[id]; else sel[id] = {name, price, qty:1};
  renderGrid(); renderSel(); calcTotal();
};

function renderSel() {
  const entries = Object.entries(sel);
  document.getElementById('selectedWrap').style.display = entries.length ? '' : 'none';
  document.getElementById('selectedList').innerHTML = entries.map(([id, s]) =>
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);margin-bottom:8px;">' +
    '<span style="color:#fff;font-size:0.88rem;font-weight:500;">' + esc(s.name) + '</span>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<button class="qty-btn" onclick="chgQty(' + JSON.stringify(id) + ',-1)">-</button>' +
    '<span style="color:#fff;font-weight:600;min-width:18px;text-align:center;">' + s.qty + '</span>' +
    '<button class="qty-btn" onclick="chgQty(' + JSON.stringify(id) + ',1)">+</button>' +
    '<span style="color:var(--gold-2);font-weight:700;font-size:0.88rem;">&#8377;' + (s.price*s.qty) + '</span>' +
    '<button onclick="toggleSvc(' + JSON.stringify(id) + ','',0)" style="background:none;border:none;color:rgba(255,100,100,0.7);cursor:pointer;">x</button>' +
    '</div></div>'
  ).join('');
}

window.chgQty = (id, d) => {
  if (sel[id]) { sel[id].qty = Math.max(1, sel[id].qty + d); renderSel(); calcTotal(); }
};

window.calcTotal = () => {
  const sub = Object.values(sel).reduce((s,v) => s + v.price*v.qty, 0);
  const disc = parseFloat(document.getElementById('discountPct').value || 0);
  const total = sub - sub*disc/100;
  document.getElementById('subtotalAmt').textContent = '&#8377;' + sub;
  document.getElementById('totalAmt').textContent = '&#8377;' + Math.round(total);
  const dr = document.getElementById('discountRow');
  dr.style.display = disc > 0 ? 'flex' : 'none';
  if (disc > 0) document.getElementById('discountAmt').textContent = '-&#8377;' + Math.round(sub*disc/100);
  const entries = Object.values(sel);
  document.getElementById('summaryItems').innerHTML = entries.length ?
    entries.map(s => '<div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.88rem;color:rgba(255,255,255,0.75);"><span>' + esc(s.name) + (s.qty>1?' x'+s.qty:'') + '</span><span>&#8377;' + s.price*s.qty + '</span></div>').join('') :
    '<div style="color:rgba(255,255,255,0.3);font-size:0.88rem;text-align:center;padding:24px 0;">No services selected</div>';
};

window.searchCustomer = async () => {
  const phone = document.getElementById('custPhone').value.trim();
  if (phone.length !== 10) { showToast('Enter 10-digit phone', 'warning'); return; }
  const cust = await findCustomerByPhone(phone);
  if (cust) {
    custId = cust.id; custName = cust.name; custVisits = cust.visit_count || 0;
    document.getElementById('custAvatar').textContent = cust.name[0].toUpperCase();
    document.getElementById('custName').textContent = cust.name;
    document.getElementById('custVisits').textContent = custVisits + ' visits';
    document.getElementById('custInfo').style.display = '';
    document.getElementById('newCustForm').style.display = 'none';
  } else {
    custId = null; custName = ''; custVisits = 0;
    document.getElementById('custInfo').style.display = 'none';
    document.getElementById('newCustForm').style.display = '';
    document.getElementById('newCustName').value = '';
  }
};

window.saveBill = async () => {
  const phone = document.getElementById('custPhone').value.trim();
  const items = Object.entries(sel);
  if (!phone || phone.length !== 10) { showToast('Enter customer phone', 'warning'); return; }
  if (!items.length) { showToast('Select at least one service', 'warning'); return; }
  let cid = custId, cname = custName;
  if (!cid) {
    const name = document.getElementById('newCustName').value.trim();
    if (!name) { showToast('Enter customer name', 'warning'); return; }
    const ref = await createBillingCustomer({name, phone});
    cid = ref.id; cname = name;
  }
  const sub = items.reduce((s,[,v]) => s + v.price*v.qty, 0);
  const disc = parseFloat(document.getElementById('discountPct').value || 0);
  const total = Math.round(sub - sub*disc/100);
  const today = new Date().toISOString().slice(0,10);
  const time = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const bill = {customer_id:cid, customer_name:cname, customer_phone:phone, date:today, time,
    items: items.map(([id,v]) => ({service_id:id, name:v.name, price:v.price, qty:v.qty})),
    subtotal:sub, discount:disc, total, payment: document.getElementById('payMethod').value};
  try {
    const ref = await createBill(bill);
    await updateBillingCustomer(cid, {visit_count: custVisits + 1});
    showToast('Bill saved!', 'success');
    showReceipt({id: ref.id, ...bill});
    sel = {}; custId = null; custName = ''; custVisits = 0;
    document.getElementById('custPhone').value = '';
    document.getElementById('custInfo').style.display = 'none';
    document.getElementById('newCustForm').style.display = 'none';
    document.getElementById('discountPct').value = '';
    renderGrid(); renderSel(); calcTotal();
  } catch(e) { showToast('Failed: ' + e.message, 'danger'); }
};

function showReceipt(bill) {
  const rows = bill.items.map(i => '<tr><td style="padding:4px 0;">' + i.name + (i.qty>1?' x'+i.qty:'') + '</td><td style="text-align:right;padding:4px 0;">&#8377;' + i.price*i.qty + '</td></tr>').join('');
  const discHtml = bill.discount > 0 ?
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin:3px 0;"><span>Subtotal</span><span>&#8377;' + bill.subtotal + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin:3px 0;"><span>Discount (' + bill.discount + '%)</span><span>-&#8377;' + Math.round(bill.subtotal*bill.discount/100) + '</span></div>' : '';
  document.getElementById('receiptContent').innerHTML =
    '<div style="font-family:Courier New,monospace;font-size:12px;color:#111;padding:20px 16px;background:#fff;">' +
    '<div style="text-align:center;margin-bottom:12px;">' +
    '<img src="../images/logo.jpeg" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #111;margin:0 auto 8px;display:block;"/>' +
    '<div style="font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">Newshades Family Salon</div>' +
    '<div style="font-size:10px;color:#555;font-style:italic;margin-top:2px;">Look Beautiful, Feel Beautiful</div>' +
    '<div style="border-top:1px dashed #aaa;margin:8px 0;"></div>' +
    '<div style="font-size:13px;font-weight:700;letter-spacing:3px;">PAYMENT RECEIPT</div>' +
    '<div style="border-top:1px dashed #aaa;margin:8px 0;"></div></div>' +
    '<div style="margin-bottom:10px;">' +
    '<div style="display:flex;justify-content:space-between;margin:3px 0;font-size:11px;"><span style="color:#555;">Bill No</span><span style="font-weight:600;">' + bill.id.slice(-8).toUpperCase() + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;margin:3px 0;font-size:11px;"><span style="color:#555;">Date</span><span>' + bill.date + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;margin:3px 0;font-size:11px;"><span style="color:#555;">Time</span><span>' + bill.time + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;margin:3px 0;font-size:11px;"><span style="color:#555;">Customer</span><span style="font-weight:600;">' + bill.customer_name + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;margin:3px 0;font-size:11px;"><span style="color:#555;">Mobile</span><span>' + bill.customer_phone + '</span></div></div>' +
    '<div style="border-top:1px dashed #aaa;margin:8px 0;"></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:2px;color:#333;margin-bottom:4px;"><span>SERVICE</span><span>AMOUNT</span></div>' +
    '<div style="border-top:1px dashed #aaa;margin:4px 0;"></div>' +
    '<table style="width:100%;border-collapse:collapse;">' + rows + '</table>' +
    '<div style="border-top:1px dashed #aaa;margin:8px 0;"></div>' + discHtml +
    '<div style="border-top:1.5px solid #111;margin:6px 0;"></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:4px 0;"><span>TOTAL</span><span>&#8377;' + bill.total + '</span></div>' +
    '<div style="border-top:1.5px solid #111;margin:6px 0;"></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;margin:3px 0;"><span style="color:#555;">Payment</span><span style="font-weight:600;">' + bill.payment + '</span></div>' +
    '<div style="border-top:1px dashed #aaa;margin:12px 0 8px;"></div>' +
    '<div style="text-align:center;font-size:12px;font-weight:700;">Thank You! Visit Again</div>' +
    '<div style="text-align:center;font-size:10px;color:#555;margin-top:4px;">Newshades Family Salon</div></div>';
  document.getElementById('receiptModal').style.display = 'flex';
}
</script>
</body>
</html>
