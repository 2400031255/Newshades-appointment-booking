<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">My Account</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="offers.html"><span class="sidebar-nav-label"><i class="fas fa-fire" style="color:#ff9500;"></i> Offers</span></a>
    <a href="profile.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="../index.html"><span class="sidebar-nav-label"><i class="fas fa-home"></i> Home</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Profile</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="custName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">
      <!-- Profile Info -->
      <div class="col-lg-6">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-user-circle me-2" style="color:var(--gold);"></i>Profile Info</h6>
          <div id="profileAlert"></div>
          <form id="profileForm">
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">FULL NAME</label><input type="text" id="profName" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">PHONE</label><input type="text" id="profPhone" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/></div>
            <div class="mb-4"><label class="field-label mb-1" style="font-size:0.75rem;">EMAIL</label><input type="email" id="profEmail" disabled style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);color:rgba(240,230,211,0.4);outline:none;font-size:0.9rem;"/></div>
            <button type="submit" class="btn-gold" style="width:100%;justify-content:center;"><i class="fas fa-save me-2"></i>Save Changes</button>
          </form>
        </div>
      </div>
      <!-- Change Password -->
      <div class="col-lg-6">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-lock me-2" style="color:var(--gold);"></i>Change Password</h6>
          <div id="pwAlert"></div>
          <form id="pwForm">
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">NEW PASSWORD</label><input type="password" id="newPw" minlength="6" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Min 6 characters"/></div>
            <div class="mb-4"><label class="field-label mb-1" style="font-size:0.75rem;">CONFIRM PASSWORD</label><input type="password" id="confirmPw" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Repeat password"/></div>
            <button type="submit" class="btn-gold" style="width:100%;justify-content:center;"><i class="fas fa-key me-2"></i>Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, updateUserProfile, showToast, auth } from '../js/firebase.js';
import { updatePassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (profile?.is_admin) { window.location.href = '../admin/dashboard.html'; }

document.getElementById('custName').textContent = profile?.full_name || user.email;
document.getElementById('profName').value  = profile?.full_name || '';
document.getElementById('profPhone').value = profile?.phone || '';
document.getElementById('profEmail').value = user.email;

document.getElementById('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await updateUserProfile(user.uid, {
      full_name: document.getElementById('profName').value.trim(),
      phone: document.getElementById('profPhone').value.trim()
    });
    showToast('Profile updated!', 'success');
  } catch { showToast('Failed to update profile.', 'danger'); }
});

document.getElementById('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const np = document.getElementById('newPw').value;
  const cp = document.getElementById('confirmPw').value;
  const alertEl = document.getElementById('pwAlert');
  if (np !== cp) {
    alertEl.innerHTML = '<div style="padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:0.84rem;background:rgba(226,93,93,0.12);border:1px solid rgba(226,93,93,0.28);color:#ff9a9a;"><i class="fas fa-exclamation-circle me-1"></i>Passwords do not match.</div>';
    return;
  }
  alertEl.innerHTML = '';
  try {
    await updatePassword(auth.currentUser, np);
    showToast('Password updated!', 'success');
    document.getElementById('pwForm').reset();
  } catch(err) {
    const msg = err.code === 'auth/requires-recent-login' ? 'Please log out and log back in before changing your password.' : err.message;
    alertEl.innerHTML = `<div style="padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:0.84rem;background:rgba(226,93,93,0.12);border:1px solid rgba(226,93,93,0.28);color:#ff9a9a;"><i class="fas fa-exclamation-circle me-1"></i>${msg}</div>`;
  }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
