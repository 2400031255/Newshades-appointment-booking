<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Enquiries – New Shades</title>
  <style>html,body{background:#000!important;color:rgba(255,255,255,0.92);}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
  <style>
  .enq-status-pending{background:rgba(255,170,77,0.14);color:#ffc36b;border:1px solid rgba(255,170,77,0.25);}
  .enq-status-contacted{background:rgba(105,152,255,0.14);color:#9dc0ff;border:1px solid rgba(105,152,255,0.25);}
  .enq-status-confirmed{background:rgba(37,211,102,0.14);color:#7ce0aa;border:1px solid rgba(37,211,102,0.25);}
  .enq-status-closed{background:rgba(150,150,150,0.14);color:rgba(240,230,211,0.5);border:1px solid rgba(150,150,150,0.2);}
  .star-rating{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end;}
  .star-rating input{display:none;}
  .star-rating label{font-size:1.8rem;color:rgba(255,255,255,0.15);cursor:pointer;transition:color 0.15s,transform 0.15s;}
  .star-rating label:hover,.star-rating label:hover~label,.star-rating input:checked~label{color:var(--gold);}
  .star-rating label:hover{transform:scale(1.2);}
  .review-textarea{width:100%;border:1px solid rgba(201,168,76,0.24);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,0.06);color:#fff;outline:none;resize:vertical;min-height:90px;font-family:'DM Sans',sans-serif;font-size:0.92rem;}
  .review-textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.16);}
  .review-textarea::placeholder{color:rgba(255,255,255,0.3);}
  </style>
</head>
<body>
<div class="cursor-glow" id="cursorGlow"></div>

<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <div class="brand-wrap">
        <img src="../images/logo.jpeg" alt="NS" class="brand-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
        <div class="brand-logo-fallback" style="display:none;width:44px;height:44px;min-width:44px;border-radius:50%;background:linear-gradient(135deg,#F5D060,#D4AF37);color:#fff;font-weight:900;font-size:1rem;align-items:center;justify-content:center;flex-shrink:0;">NS</div>
        <div class="brand-text" style="margin-left:0;"><span class="brand-name">New Shades</span><span class="brand-tagline">Premium Salon</span></div>
      </div>
    </a>
    <button class="navbar-toggler-custom" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home me-1"></i>Home</a></li>
        <li class="nav-item"><a class="nav-link" href="enquire.html"><i class="fas fa-paper-plane me-1"></i>Enquire</a></li>
        <li class="nav-item"><a class="nav-link nav-active" href="enquiries.html"><i class="fas fa-list-alt me-1"></i>My Enquiries</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html"><i class="fas fa-fire me-1" style="color:#ff9500;"></i>Offers</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user-circle me-1"></i>Profile</a></li>
        <li class="nav-item ms-lg-2"><a class="btn-nav-outline" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-orb"></div>
  <div class="container">
    <div class="page-header-inner reveal-up">
      <div>
        <div class="section-badge mb-2"><span class="badge-dot"></span> My Enquiries</div>
        <h1 class="page-header-title">My <span>Enquiries</span></h1>
        <p class="page-header-sub">Track all your enquiries and their current status.</p>
      </div>
      <a href="enquire.html" class="btn-gold-hero"><i class="fas fa-plus me-2"></i>New Enquiry</a>
    </div>
  </div>
</div>

<section class="booking-section">
  <div class="container">
    <div id="enquiriesList"><div class="text-center py-5" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
    <div id="reviewSection" style="display:none;" class="mt-5 reveal-up">
      <div class="section-badge mb-3"><span class="badge-dot"></span> Your Experience</div>
      <div style="border-radius:20px;padding:28px;background:linear-gradient(145deg,rgba(201,168,76,0.08),rgba(255,255,255,0.03));border:1px solid rgba(201,168,76,0.22);">
        <h5 style="font-family:'Playfair Display',serif;color:#fff;margin-bottom:4px;"><i class="fas fa-star me-2 text-gold"></i>Leave a Review</h5>
        <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:20px;">How was your experience at New Shades?</p>
        <form id="reviewForm">
          <label class="field-label mb-2">Your Rating</label>
          <div class="star-rating mb-3">
            <input type="radio" name="rating" id="r5" value="5"><label for="r5"><i class="fas fa-star"></i></label>
            <input type="radio" name="rating" id="r4" value="4"><label for="r4"><i class="fas fa-star"></i></label>
            <input type="radio" name="rating" id="r3" value="3"><label for="r3"><i class="fas fa-star"></i></label>
            <input type="radio" name="rating" id="r2" value="2"><label for="r2"><i class="fas fa-star"></i></label>
            <input type="radio" name="rating" id="r1" value="1"><label for="r1"><i class="fas fa-star"></i></label>
          </div>
          <label class="field-label mb-2">Your Review</label>
          <textarea id="reviewComment" class="review-textarea mb-3" placeholder="Tell us about your experience…" maxlength="500" required></textarea>
          <button type="submit" class="btn-gold-hero" style="padding:12px 28px;"><i class="fas fa-paper-plane me-2"></i>Submit Review</button>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="../js/main.js" defer></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getEnquiriesForUser, getReviewByUser, createReview, updateReview, formatDate, showToast } from '../js/firebase.js';

const user = await requireAuth('../login.html');
const [profile, enquiries, existingReview] = await Promise.all([
  getUserProfile(user.uid),
  getEnquiriesForUser(user.uid),
  getReviewByUser(user.uid)
]);

const list = document.getElementById('enquiriesList');
if (enquiries.length) {
  list.innerHTML = enquiries.map((e,i) => `
    <div class="col-12 reveal-up" style="animation-delay:${i*0.07}s">
      <div class="appt-card">
        <div class="appt-card-top">
          <div>
            <div class="appt-id"><i class="fas fa-hashtag me-1" style="font-size:0.8rem;"></i>Enquiry #${(e.id||'').slice(0,6)}</div>
            <div class="appt-date-created">Submitted: ${formatDate(e.created_at)}</div>
          </div>
          <span class="enq-status-${(e.status||'pending').toLowerCase()}" style="padding:5px 14px;border-radius:999px;font-size:0.78rem;font-weight:700;">${e.status}</span>
        </div>
        <div class="appt-services mt-3"><i class="fas fa-concierge-bell me-2 text-gold"></i>${e.selected_services}</div>
        <div class="appt-meta mt-3">
          <div class="appt-meta-item"><i class="fas fa-calendar-alt text-gold" style="font-size:0.85rem;"></i><div><div class="appt-meta-label">Preferred Date</div><div class="appt-meta-val">${e.preferred_date||'—'}</div></div></div>
          <div class="appt-meta-item"><i class="fas fa-clock text-gold" style="font-size:0.85rem;"></i><div><div class="appt-meta-label">Preferred Time</div><div class="appt-meta-val">${e.preferred_time||'Flexible'}</div></div></div>
        </div>
        ${e.admin_notes?`<div style="margin-top:10px;padding:10px 14px;border-radius:10px;background:rgba(105,152,255,0.06);border:1px solid rgba(105,152,255,0.2);font-size:0.82rem;color:#9dc0ff;"><i class="fas fa-user-shield me-2" style="font-size:0.75rem;"></i><strong>Team Note:</strong> ${e.admin_notes}</div>`:''}
        ${e.emp_name?`<div style="margin-top:10px;padding:10px 14px;border-radius:10px;background:rgba(105,152,255,0.05);border:1px solid rgba(105,152,255,0.15);font-size:0.82rem;"><span style="color:rgba(240,230,211,0.5);"><i class="fas fa-user-tie me-2" style="color:#9dc0ff;"></i>Assigned:</span><strong style="color:#9dc0ff;margin-left:4px;">${e.emp_name}</strong></div>`:''}
      </div>
    </div>`).join('');
  list.className = 'row g-4';
} else {
  list.innerHTML = `<div class="empty-state reveal-up"><div class="empty-icon"><i class="fas fa-clipboard-list"></i></div><h5 style="color:#fff;font-family:'Playfair Display',serif;">No enquiries yet</h5><p class="text-muted">Make your first enquiry and our team will get back to you!</p><a href="enquire.html" class="btn-gold-hero mt-2"><i class="fas fa-paper-plane me-2"></i>Make an Enquiry</a></div>`;
}

const hasConfirmed = enquiries.some(e => e.status === 'Confirmed' || e.status === 'Closed');
if (hasConfirmed && !existingReview) {
  document.getElementById('reviewSection').style.display = '';
}

document.getElementById('reviewForm')?.addEventListener('submit', async e => {
  e.preventDefault();
  const rating = parseInt(document.querySelector('input[name="rating"]:checked')?.value);
  if (!rating) { showToast('Please select a rating.', 'warning'); return; }
  try {
    await createReview({ user_id: user.uid, full_name: profile?.full_name||user.email, rating, review_text: document.getElementById('reviewComment').value.trim(), comment: document.getElementById('reviewComment').value.trim() });
    showToast('Review submitted! Thank you.', 'success');
    document.getElementById('reviewSection').style.display = 'none';
  } catch(err) { showToast('Failed to submit review.', 'danger'); }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
</script>
</body>
</html>
