<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Enquiries – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">My Account</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="offers.html"><span class="sidebar-nav-label"><i class="fas fa-fire" style="color:#ff9500;"></i> Offers</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="../index.html"><span class="sidebar-nav-label"><i class="fas fa-home"></i> Home</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Enquiries</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="custName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="admin-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h6 class="fw-bold mb-0" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-clipboard-list me-2" style="color:var(--gold);"></i>My Enquiries <span style="color:var(--gold);" id="enqCount"></span></h6>

      </div>
      <div id="enqList"><div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getEnquiriesForUser, db, esc } from '../js/firebase.js';
import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (profile?.is_admin) { window.location.href = '../admin/dashboard.html'; }
document.getElementById('custName').textContent = profile?.full_name || user.email;

const statusStyle = {
  Pending:   'background:rgba(255,170,77,0.16);color:#ffc36b;',
  Contacted: 'background:rgba(105,152,255,0.16);color:#9dc0ff;',
  Confirmed: 'background:rgba(37,211,102,0.16);color:#7ce0aa;',
  Closed:    'background:rgba(150,150,150,0.14);color:rgba(240,230,211,0.5);'
};

// Fetch by user_id + also by phone to catch public form submissions
let enquiries = await getEnquiriesForUser(user.uid);
if (profile?.phone) {
  try {
    const snap = await getDocs(query(collection(db, 'enquiries'), where('phone', '==', profile.phone)));
    const byPhone = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const ids = new Set(enquiries.map(e => e.id));
    byPhone.forEach(e => { if (!ids.has(e.id)) enquiries.push(e); });
    enquiries.sort((a, b) => (b.created_at?.seconds || 0) - (a.created_at?.seconds || 0));
  } catch {}
}
document.getElementById('enqCount').textContent = `(${enquiries.length})`;
const list = document.getElementById('enqList');
if (!enquiries.length) {
  list.innerHTML = '<div class="text-center py-5" style="color:var(--text-muted);"><i class="fas fa-clipboard" style="font-size:2.5rem;opacity:0.2;"></i><p class="mt-3">No enquiries yet.</p><a href="../index.html#enquire" class="btn-gold" style="font-size:0.85rem;padding:10px 24px;"><i class="fas fa-paper-plane me-2"></i>Make an Enquiry</a></div>';
} else {
  list.innerHTML = enquiries.map(e => `
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:18px 20px;margin-bottom:12px;">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
        <div>
          <div style="font-weight:700;color:#fff;font-size:0.95rem;">${esc(e.selected_services||'—')}</div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:3px;">${esc(e.preferred_date||'—')} · ${esc(e.preferred_time||'Flexible')}</div>
        </div>
        <span style="padding:4px 14px;border-radius:999px;font-size:0.75rem;font-weight:700;${statusStyle[e.status]||statusStyle.Pending}">${esc(e.status)}</span>
      </div>
      ${e.admin_notes ? `<div style="font-size:0.82rem;color:#9dc0ff;padding:8px 12px;border-radius:10px;background:rgba(105,152,255,0.07);border:1px solid rgba(105,152,255,0.15);"><i class="fas fa-comment-dots me-1"></i>${esc(e.admin_notes)}</div>` : ''}
      ${e.emp_name ? `<div style="font-size:0.78rem;color:rgba(240,230,211,0.5);margin-top:6px;"><i class="fas fa-user-tie me-1"></i>Assigned to: ${esc(e.emp_name)}</div>` : ''}
    </div>`).join('');
}

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
