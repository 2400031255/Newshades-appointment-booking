<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offers – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">My Account</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="offers.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-fire" style="color:#ff9500;"></i> Offers</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="../index.html"><span class="sidebar-nav-label"><i class="fas fa-home"></i> Home</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Current Offers</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="custName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="admin-card">
      <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-fire me-2" style="color:#ff9500;"></i>Active Offers</h6>
      <div id="offersList"><div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getActiveOffers, esc } from '../js/firebase.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
if (profile?.is_admin) { window.location.href = '../admin/dashboard.html'; }
document.getElementById('custName').textContent = profile?.full_name || user.email;

const offers = await getActiveOffers();
const list = document.getElementById('offersList');
if (!offers.length) {
  list.innerHTML = '<div class="text-center py-5" style="color:var(--text-muted);"><i class="fas fa-fire" style="font-size:2.5rem;opacity:0.2;"></i><p class="mt-3">No active offers right now. Check back soon!</p></div>';
} else {
  list.innerHTML = `<div class="row g-4">${offers.map(o => `
    <div class="col-md-6">
      <div style="background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.04));border:1px solid rgba(201,168,76,0.3);border-radius:18px;padding:24px;">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 style="color:#fff;font-weight:700;font-family:'Playfair Display',serif;margin:0;">${esc(o.title)}</h6>
          ${o.discount_text ? `<span style="padding:3px 12px;border-radius:999px;font-size:0.72rem;font-weight:900;background:linear-gradient(135deg,rgba(201,168,76,0.35),rgba(201,168,76,0.15));color:var(--gold);border:1px solid rgba(201,168,76,0.4);">${esc(o.discount_text)}</span>` : ''}
        </div>
        ${o.description ? `<p style="font-size:0.85rem;color:rgba(240,230,211,0.65);margin:8px 0;">${esc(o.description)}</p>` : ''}
        ${o.valid_until ? `<div style="font-size:0.75rem;color:rgba(240,230,211,0.4);"><i class="fas fa-calendar-alt me-1"></i>Valid until: ${esc(o.valid_until)}</div>` : ''}
        <a href="../index.html#enquire" class="btn-gold" style="margin-top:14px;font-size:0.82rem;padding:8px 20px;display:inline-flex;"><i class="fas fa-paper-plane me-2"></i>Book Now</a>
      </div>
    </div>`).join('')}</div>`;
}

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
