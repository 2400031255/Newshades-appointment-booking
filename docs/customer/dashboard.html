<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Dashboard – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">My Account</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="../index.html"><span class="sidebar-nav-label"><i class="fas fa-home"></i> Home</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Dashboard</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="custName"></span></div>
  </div>
  <div class="admin-page-body">

    <!-- Welcome Card -->
    <div class="admin-card mb-4" style="background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.04));border-color:rgba(201,168,76,0.3);">
      <div class="d-flex align-items-center gap-4">
        <div class="service-icon" style="width:60px;height:60px;font-size:1.5rem;flex-shrink:0;"><i class="fas fa-user"></i></div>
        <div>
          <h5 class="fw-bold mb-1" style="font-family:'Playfair Display',serif;" id="welcomeName">Welcome!</h5>
          <div style="color:var(--text-muted);font-size:0.85rem;">Manage your appointments and profile below.</div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-4 mb-4">
      <div class="col-md-3"><div class="stat-card" style="border-left-color:#C9A84C;margin:0;"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted small mb-1">Total Enquiries</div><div class="stat-number" id="statTotal">—</div></div><div class="stat-icon" style="color:#C9A84C;"><i class="fas fa-clipboard-list"></i></div></div></div></div>
      <div class="col-md-3"><div class="stat-card" style="border-left-color:#ffc107;margin:0;"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted small mb-1">Pending</div><div class="stat-number" id="statPending">—</div></div><div class="stat-icon" style="color:#ffc107;"><i class="fas fa-clock"></i></div></div></div></div>
      <div class="col-md-3"><div class="stat-card" style="border-left-color:#25d366;margin:0;"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted small mb-1">Confirmed</div><div class="stat-number" id="statConfirmed">—</div></div><div class="stat-icon" style="color:#25d366;"><i class="fas fa-check-circle"></i></div></div></div></div>
      <div class="col-md-3"><div class="stat-card" style="border-left-color:#6f42c1;margin:0;"><div class="d-flex justify-content-between align-items-center"><div><div class="text-muted small mb-1">Closed</div><div class="stat-number" id="statClosed">—</div></div><div class="stat-icon" style="color:#6f42c1;"><i class="fas fa-archive"></i></div></div></div></div>
    </div>

    <!-- Recent Enquiries -->
    <div class="admin-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h6 class="fw-bold mb-0" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-clipboard-list me-2" style="color:var(--gold);"></i>My Recent Enquiries</h6>
        <a href="enquiries.html" class="btn-outline-gold" style="font-size:0.8rem;padding:6px 16px;">View All</a>
      </div>
      <div id="recentEnqs"><div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin me-2"></i>Loading…</div></div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-4">

      <div class="col-md-4">
        <a href="profile.html" style="text-decoration:none;">
          <div class="admin-card text-center">
            <div class="service-icon mx-auto mb-3" style="color:#9dc0ff;"><i class="fas fa-user-circle"></i></div>
            <h6 class="fw-bold">My Profile</h6>
            <p class="text-muted small">Update your details</p>
          </div>
        </a>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getUserProfile, getEnquiriesForUser, db, esc } from '../js/firebase.js';
import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const profile = await getUserProfile(user.uid);
// If admin or no profile, redirect appropriately
if (profile?.is_admin) { window.location.href = '../admin/dashboard.html'; }

document.getElementById('custName').textContent = profile?.full_name || user.email;
document.getElementById('welcomeName').textContent = `Welcome, ${profile?.full_name || 'there'}!`;

let enquiries = await getEnquiriesForUser(user.uid);
if (profile?.phone) {
  try {
    const snap = await getDocs(query(collection(db, 'enquiries'), where('phone', '==', profile.phone)));
    const byPhone = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const ids = new Set(enquiries.map(e => e.id));
    byPhone.forEach(e => { if (!ids.has(e.id)) enquiries.push(e); });
    enquiries.sort((a, b) => (b.created_at?.seconds || 0) - (a.created_at?.seconds || 0));
  } catch {}
}
document.getElementById('statTotal').textContent     = enquiries.length;
document.getElementById('statPending').textContent   = enquiries.filter(e => e.status === 'Pending').length;
document.getElementById('statConfirmed').textContent = enquiries.filter(e => e.status === 'Confirmed').length;
document.getElementById('statClosed').textContent    = enquiries.filter(e => e.status === 'Closed').length;

const statusStyle = {
  Pending:   'background:rgba(255,170,77,0.16);color:#ffc36b;',
  Contacted: 'background:rgba(105,152,255,0.16);color:#9dc0ff;',
  Confirmed: 'background:rgba(37,211,102,0.16);color:#7ce0aa;',
  Closed:    'background:rgba(150,150,150,0.14);color:rgba(240,230,211,0.5);'
};

const recentEl = document.getElementById('recentEnqs');
if (!enquiries.length) {
  recentEl.innerHTML = '<div class="text-center py-4" style="color:var(--text-muted);"><i class="fas fa-clipboard me-2"></i>No enquiries yet. Visit the <a href="../index.html#enquire" style="color:var(--gold);">home page</a> to make one.</div>';
} else {
  recentEl.innerHTML = `<div class="table-responsive"><table class="admin-table">
    <thead><tr><th>Services</th><th>Date</th><th>Time</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody>${enquiries.slice(0,5).map(e => `<tr>
      <td class="admin-td-bold">${esc(e.selected_services||'—')}</td>
      <td class="admin-td-muted">${esc(e.preferred_date||'—')}</td>
      <td class="admin-td-muted">${esc(e.preferred_time||'Flexible')}</td>
      <td><span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;${statusStyle[e.status]||statusStyle.Pending}">${esc(e.status)}</span></td>
      <td style="font-size:0.82rem;color:rgba(240,230,211,0.6);">${esc(e.admin_notes||'—')}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
