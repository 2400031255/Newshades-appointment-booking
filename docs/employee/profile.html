<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Employee Portal</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> My Attendance</span></a>
    <a href="leave.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="salary.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> My Salary</span></a>
    <a href="profile.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Profile</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="empNameTop"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">

      <!-- Left: Avatar + Info -->
      <div class="col-lg-4">
        <!-- Avatar Card -->
        <div class="admin-card text-center mb-4" style="padding:32px 20px;">
          <div id="avatarCircle" style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:#120e08;margin:0 auto 16px;box-shadow:0 12px 32px rgba(201,168,76,0.35);">E</div>
          <div style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:#fff;" id="cardName">—</div>
          <div style="font-size:0.78rem;color:var(--gold-2);margin-top:4px;" id="cardRole">—</div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:6px;" id="cardEmail">—</div>
          <div style="margin-top:16px;padding:12px;border-radius:12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.15);">
            <div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Monthly Salary</div>
            <div style="font-size:1.3rem;font-weight:700;color:var(--gold);" id="cardSalary">—</div>
          </div>
        </div>

        <!-- UPI / Payment Details -->
        <div class="admin-card">
          <h6 class="fw-bold mb-1" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-qrcode me-2" style="color:var(--gold);"></i>Payment Details</h6>
          <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:20px;">Admin uses this to pay your salary directly.</p>
          <div id="upiAlert"></div>
          <div class="mb-3">
            <label class="field-label mb-1" style="font-size:0.75rem;">UPI ID</label>
            <input type="text" id="upiId" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="yourname@upi"/>
          </div>
          <div class="mb-3">
            <label class="field-label mb-1" style="font-size:0.75rem;">UPI APP <span style="color:rgba(240,230,211,0.3);">(Optional)</span></label>
            <select id="upiApp" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(20,16,10,0.95);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;cursor:pointer;">
              <option value="">Select App</option>
              <option>GPay</option><option>PhonePe</option><option>Paytm</option><option>BHIM</option><option>Amazon Pay</option><option>Other</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="field-label mb-1" style="font-size:0.75rem;">QR CODE IMAGE <span style="color:rgba(240,230,211,0.3);">(Optional)</span></label>
            <div id="qrPreviewWrap" style="display:none;margin-bottom:10px;">
              <img id="qrPreviewImg" style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:#fff;padding:8px;"/>
            </div>
            <div onclick="document.getElementById('qrFileInput').click()" style="border:2px dashed rgba(201,168,76,0.25);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:border-color 0.2s;" onmouseover="this.style.borderColor='rgba(201,168,76,0.5)'" onmouseout="this.style.borderColor='rgba(201,168,76,0.25)'">
              <i class="fas fa-qrcode" style="font-size:1.6rem;color:rgba(201,168,76,0.35);margin-bottom:6px;display:block;"></i>
              <div style="font-size:0.8rem;color:rgba(240,230,211,0.4);">Click to upload QR code</div>
            </div>
            <input type="file" id="qrFileInput" accept="image/*" style="display:none;"/>
            <div id="qrUploadStatus" style="font-size:0.78rem;margin-top:6px;"></div>
          </div>
          <button id="saveUpiBtn" class="btn-gold" style="width:100%;justify-content:center;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 8px 24px rgba(37,211,102,0.25);"><i class="fas fa-save me-2"></i>Save Payment Details</button>
        </div>
      </div>

      <!-- Right: Edit Info + Change Password -->
      <div class="col-lg-8">
        <!-- Edit Info -->
        <div class="admin-card mb-4">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-edit me-2" style="color:var(--gold);"></i>Edit Information</h6>
          <div id="infoAlert"></div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="field-label mb-1" style="font-size:0.75rem;">FULL NAME</label>
              <input type="text" id="editName" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/>
            </div>
            <div class="col-sm-6">
              <label class="field-label mb-1" style="font-size:0.75rem;">PHONE</label>
              <input type="tel" id="editPhone" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="+91 XXXXX XXXXX"/>
            </div>
            <div class="col-12">
              <label class="field-label mb-1" style="font-size:0.75rem;">EMAIL <span style="color:rgba(240,230,211,0.3);font-size:0.7rem;">(cannot change)</span></label>
              <input type="email" id="editEmail" disabled style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.06);color:rgba(240,230,211,0.4);outline:none;font-size:0.9rem;cursor:not-allowed;"/>
            </div>
            <div class="col-12 mt-1">
              <button id="saveInfoBtn" class="btn-gold" style="width:100%;justify-content:center;"><i class="fas fa-save me-2"></i>Save Changes</button>
            </div>
          </div>
        </div>

        <!-- Change Password -->
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-lock me-2" style="color:var(--gold);"></i>Change Password</h6>
          <div id="pwAlert"></div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="field-label mb-1" style="font-size:0.75rem;">CURRENT PASSWORD</label>
              <div style="position:relative;">
                <input type="password" id="currentPw" style="width:100%;padding:11px 44px 11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Current password"/>
                <button type="button" onclick="toggleField('currentPw','eyeCur')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;"><i class="fas fa-eye" id="eyeCur"></i></button>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="field-label mb-1" style="font-size:0.75rem;">NEW PASSWORD</label>
              <div style="position:relative;">
                <input type="password" id="newPw" style="width:100%;padding:11px 44px 11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Min 6 characters"/>
                <button type="button" onclick="toggleField('newPw','eyeNew')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;"><i class="fas fa-eye" id="eyeNew"></i></button>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="field-label mb-1" style="font-size:0.75rem;">CONFIRM NEW PASSWORD</label>
              <input type="password" id="confirmPw" style="width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" placeholder="Repeat new password"/>
            </div>
            <div class="col-12 mt-1">
              <button id="changePwBtn" class="btn-gold" style="justify-content:center;background:linear-gradient(135deg,#6f42c1,#4a2d8a);box-shadow:0 8px 24px rgba(111,66,193,0.3);padding:11px 28px;"><i class="fas fa-key me-2"></i>Change Password</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getEmployeeProfile, showToast, auth, db } from '../js/firebase.js';
import { doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { updatePassword, reauthenticateWithCredential, EmailAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const CLOUD_NAME = 'newshades';
const UPLOAD_PRESET = 'newshades_gallery';

const user = await requireAuth('../login.html');
const emp  = await getEmployeeProfile(user.uid);
if (!emp) { window.location.href = '../login.html'; }

const name = emp.full_name || user.email;
document.getElementById('empNameTop').textContent = name;
document.getElementById('cardName').textContent   = name;
document.getElementById('cardRole').textContent   = emp.role || 'Staff';
document.getElementById('cardEmail').textContent  = user.email;
document.getElementById('cardSalary').textContent = emp.monthly_salary ? `₹${Math.round(emp.monthly_salary).toLocaleString()}/mo` : '—';
document.getElementById('avatarCircle').textContent = name[0].toUpperCase();
document.getElementById('editName').value  = emp.full_name || '';
document.getElementById('editPhone').value = emp.phone || '';
document.getElementById('editEmail').value = user.email;
document.getElementById('upiId').value     = emp.upi_id || '';
document.getElementById('upiApp').value    = emp.upi_app || '';
if (emp.qr_code_url) {
  document.getElementById('qrPreviewImg').src = emp.qr_code_url;
  document.getElementById('qrPreviewWrap').style.display = '';
}

function flash(elId, msg, type='danger') {
  const colors = { danger:'rgba(226,93,93,0.12)|rgba(226,93,93,0.28)|#ff9a9a', success:'rgba(37,211,102,0.1)|rgba(37,211,102,0.28)|#7ce0aa' };
  const [bg,border,color] = colors[type].split('|');
  document.getElementById(elId).innerHTML = `<div style="padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:0.84rem;background:${bg};border:1px solid ${border};color:${color};display:flex;align-items:center;gap:8px;"><i class="fas fa-${type==='success'?'check':'exclamation'}-circle"></i>${msg}</div>`;
}

// Save info
document.getElementById('saveInfoBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveInfoBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
  try {
    const newName = document.getElementById('editName').value.trim();
    await updateDoc(doc(db, 'employees', user.uid), { full_name: newName, phone: document.getElementById('editPhone').value.trim() });
    document.getElementById('cardName').textContent = newName;
    document.getElementById('avatarCircle').textContent = newName[0]?.toUpperCase() || 'E';
    flash('infoAlert','Profile updated successfully!','success');
  } catch { flash('infoAlert','Failed to update profile.'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Changes'; }
});

// QR upload
let qrUrl = emp.qr_code_url || '';
document.getElementById('qrFileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('qrPreviewImg').src = ev.target.result; document.getElementById('qrPreviewWrap').style.display = ''; };
  reader.readAsDataURL(file);
  document.getElementById('qrUploadStatus').innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Processing…';
  try {
    const compressed = await new Promise(resolve => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); const c=document.createElement('canvas'); const max=800; let w=img.width,h=img.height; if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}} c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>resolve(b||file),'image/jpeg',0.88); };
      img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);}; img.src=url;
    });
    // Try Cloudinary if configured, else base64
    let url = '';
    if (CLOUD_NAME && CLOUD_NAME !== 'newshades') {
      const fd = new FormData(); fd.append('file', compressed); fd.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method:'POST',body:fd});
      const data = await res.json();
      if (data.secure_url) url = data.secure_url;
    }
    if (!url) {
      url = await new Promise(r => { const fr=new FileReader(); fr.onload=ev=>r(ev.target.result); fr.readAsDataURL(compressed); });
    }
    qrUrl = url;
    document.getElementById('qrPreviewImg').src = qrUrl;
    document.getElementById('qrUploadStatus').innerHTML = '<span style="color:#7ce0aa;"><i class="fas fa-check-circle me-1"></i>QR ready!</span>';
  } catch { document.getElementById('qrUploadStatus').innerHTML = '<span style="color:#ff9a9a;">Failed. Try again.</span>'; }
});

// Save UPI
document.getElementById('saveUpiBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveUpiBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
  try {
    const updates = { upi_id: document.getElementById('upiId').value.trim(), upi_app: document.getElementById('upiApp').value };
    if (qrUrl) updates.qr_code_url = qrUrl;
    await updateDoc(doc(db, 'employees', user.uid), updates);
    flash('upiAlert','Payment details saved!','success');
  } catch { flash('upiAlert','Failed to save payment details.'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Payment Details'; }
});

// Change password
document.getElementById('changePwBtn').addEventListener('click', async () => {
  const cur = document.getElementById('currentPw').value;
  const nw  = document.getElementById('newPw').value;
  const cf  = document.getElementById('confirmPw').value;
  if (!cur || !nw) { flash('pwAlert','Fill in all password fields.'); return; }
  if (nw.length < 6) { flash('pwAlert','New password must be at least 6 characters.'); return; }
  if (nw !== cf) { flash('pwAlert','New passwords do not match.'); return; }
  const btn = document.getElementById('changePwBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating…';
  try {
    const cred = EmailAuthProvider.credential(user.email, cur);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, nw);
    flash('pwAlert','Password changed successfully!','success');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
  } catch(err) {
    flash('pwAlert', err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
      ? 'Current password is incorrect.' : err.message);
  } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-key me-2"></i>Change Password'; }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
<script>
function toggleField(id, iconId) {
  const inp = document.getElementById(id);
  const ico = document.getElementById(iconId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
</body>
</html>
