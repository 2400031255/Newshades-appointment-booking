<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Attendance – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Employee Portal</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="attendance.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> My Attendance</span></a>
    <a href="leave.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="salary.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> My Salary</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Attendance</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="empName"></span></div>
  </div>
  <div class="admin-page-body">
    <!-- Month Selector + Stats -->
    <div class="admin-card mb-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
          <label class="field-label" style="font-size:0.8rem;white-space:nowrap;">SELECT MONTH</label>
          <input type="month" id="monthPicker" style="padding:8px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;" onchange="load()"/>
        </div>
        <div class="d-flex gap-4">
          <div class="text-center"><div style="font-size:1.4rem;font-weight:700;color:#7ce0aa;" id="countPresent">—</div><div style="font-size:0.75rem;color:var(--text-muted);">Present</div></div>
          <div class="text-center"><div style="font-size:1.4rem;font-weight:700;color:#ff6b6b;" id="countAbsent">—</div><div style="font-size:0.75rem;color:var(--text-muted);">Absent</div></div>
          <div class="text-center"><div style="font-size:1.4rem;font-weight:700;color:#ffc36b;" id="countLeave">—</div><div style="font-size:0.75rem;color:var(--text-muted);">On Leave</div></div>
          <div class="text-center"><div style="font-size:1.4rem;font-weight:700;color:var(--gold);" id="countPct">—</div><div style="font-size:0.75rem;color:var(--text-muted);">Attendance %</div></div>
        </div>
      </div>
    </div>
    <!-- Table -->
    <div class="admin-card">
      <h6 class="fw-bold mb-4" style="color:#fff;">Attendance Records</h6>
      <div class="table-responsive">
        <table class="admin-table">
          <thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Check In</th><th>Check Out</th><th>Notes</th></tr></thead>
          <tbody id="attBody"><tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getEmployeeProfile, db, to12hr } from '../js/firebase.js';
import { getDocs, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const emp = await getEmployeeProfile(user.uid);
if (!emp) { window.location.href = '../login.html'; }
document.getElementById('empName').textContent = emp.full_name || user.email;

const now = new Date();
document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const statusStyle = { Present:'background:rgba(37,211,102,0.16);color:#7ce0aa;', Absent:'background:rgba(255,107,107,0.16);color:#ff6b6b;', 'On Leave':'background:rgba(255,170,77,0.16);color:#ffc36b;', 'Half Day':'background:rgba(105,152,255,0.16);color:#9dc0ff;' };

window.load = async () => {
  const month = document.getElementById('monthPicker').value;
  const q = query(collection(db,'attendance'), where('employee_id','==',user.uid));
  const snap = await getDocs(q);
  const records = snap.docs.map(d=>d.data()).filter(r=>r.date&&r.date.startsWith(month));
  records.sort((a,b)=>a.date.localeCompare(b.date));

  const present = records.filter(r=>r.status==='Present').length;
  const absent  = records.filter(r=>r.status==='Absent').length;
  const leave   = records.filter(r=>r.status==='On Leave').length;
  const total   = present + absent + leave;
  document.getElementById('countPresent').textContent = present;
  document.getElementById('countAbsent').textContent  = absent;
  document.getElementById('countLeave').textContent   = leave;
  document.getElementById('countPct').textContent     = total ? Math.round(present/total*100)+'%' : '—';

  document.getElementById('attBody').innerHTML = records.map(r => {
    const d = new Date(r.date);
    const st = statusStyle[r.status] || statusStyle.Absent;
    return `<tr>
      <td class="admin-td-bold">${r.date}</td>
      <td class="admin-td-muted">${days[d.getDay()]}</td>
      <td><span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;${st}">${r.status}</span></td>
      <td class="admin-td-muted">${r.check_in ? to12hr(r.check_in) : '—'}</td>
      <td class="admin-td-muted">${r.check_out ? to12hr(r.check_out) : '—'}</td>
      <td style="font-size:0.82rem;color:var(--text-muted);">${r.notes||'—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No records for this month.</td></tr>';
};
load();

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
