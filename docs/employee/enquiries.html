<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Enquiries – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
  <style>
  .enq-badge-pending{background:rgba(255,170,77,0.16);color:#ffc36b;}
  .enq-badge-contacted{background:rgba(105,152,255,0.16);color:#9dc0ff;}
  .enq-badge-confirmed{background:rgba(71,188,121,0.16);color:#7ce0aa;}
  .enq-badge-closed{background:rgba(150,150,150,0.14);color:rgba(240,230,211,0.45);}
  .appt-mob-btn{padding:7px 14px;border-radius:999px;border:1px solid;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
  .appt-mob-btn.btn-call{background:rgba(37,211,102,0.1);border-color:rgba(37,211,102,0.4);color:#25d366;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
  .appt-mob-btn.btn-copy{background:rgba(201,168,76,0.08);border-color:rgba(201,168,76,0.3);color:var(--gold-2);}
  </style>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Employee Portal</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> My Attendance</span></a>
    <a href="leave.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="salary.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> My Salary</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Enquiries</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="empName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="admin-card">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h6 class="fw-bold mb-0" style="color:#fff;">Assigned to Me <span style="color:var(--gold);" id="totalCount"></span></h6>
        <div class="d-flex gap-2 flex-wrap align-items-center">
          <input type="text" id="searchInput" placeholder="Search name, phone, service…"
            style="padding:8px 12px;border-radius:999px;border:1px solid rgba(201,168,76,0.24);background:rgba(255,255,255,0.06);color:#fff;outline:none;font-size:0.85rem;width:220px;"
            oninput="renderTable()"/>
          <div id="statusFilters" class="d-flex gap-2 flex-wrap"></div>
        </div>
      </div>

      <!-- Desktop table -->
      <div class="table-responsive d-none d-md-block">
        <table class="admin-table">
          <thead><tr><th>#</th><th>Customer</th><th>Phone</th><th>Services</th><th>Date</th><th>Status</th><th>Notes</th></tr></thead>
          <tbody id="enqBody"><tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted);">Loading…</td></tr></tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div class="d-md-none" id="mobileCards"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getEmployeeProfile, esc, showToast, db } from '../js/firebase.js';
import { collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const emp  = await getEmployeeProfile(user.uid);
if (!emp) { window.location.href = '../login.html'; }

document.getElementById('empName').textContent = emp.full_name || user.email;

let allEnqs = [], activeFilter = '';

// Query Firestore directly for enquiries assigned to this employee
try {
  const snap = await getDocs(query(collection(db, 'enquiries'), where('assigned_employee_id', '==', user.uid)));
  allEnqs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.created_at?.seconds || 0) - (a.created_at?.seconds || 0));
} catch(err) {
  console.error('Failed to load enquiries:', err);
}

// Status filter buttons
const filters = ['', 'Pending', 'Contacted', 'Confirmed', 'Closed'];
const sf = document.getElementById('statusFilters');
filters.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'admin-filter-btn' + (s === '' ? ' active' : '');
  btn.textContent = s || 'All';
  btn.onclick = () => {
    sf.querySelectorAll('.admin-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = s;
    renderTable();
  };
  sf.appendChild(btn);
});

window.renderTable = function() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allEnqs.filter(e => {
    const matchStatus = !activeFilter || e.status === activeFilter;
    const matchSearch = !q
      || (e.full_name || '').toLowerCase().includes(q)
      || (e.phone || '').includes(q)
      || (e.selected_services || '').toLowerCase().includes(q);
    return matchStatus && matchSearch;
  });

  document.getElementById('totalCount').textContent = `(${filtered.length})`;

  document.getElementById('enqBody').innerHTML = filtered.map(e => `<tr>
    <td class="admin-td-muted">#${(e.id || '').slice(0, 6)}</td>
    <td class="admin-td-bold">${esc(e.full_name)}</td>
    <td>
      <div style="display:flex;align-items:center;gap:4px;">
        <span class="admin-td-muted" style="font-size:0.82rem;">${esc(e.phone)}</span>
        <button onclick="navigator.clipboard.writeText('${e.phone}').then(()=>showToast('Copied!','success'))"
          style="width:22px;height:22px;border-radius:5px;border:1px solid rgba(201,168,76,0.3);background:rgba(201,168,76,0.08);color:var(--gold);font-size:0.65rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;">
          <i class="fas fa-copy"></i></button>
        <a href="tel:${e.phone}"
          style="width:22px;height:22px;border-radius:5px;border:1px solid rgba(37,211,102,0.4);background:rgba(37,211,102,0.12);color:#25d366;font-size:0.65rem;display:inline-flex;align-items:center;justify-content:center;">
          <i class="fas fa-phone"></i></a>
      </div>
    </td>
    <td class="admin-td-muted" style="max-width:150px;font-size:0.82rem;">${esc(e.selected_services)}</td>
    <td class="admin-td-bold" style="white-space:nowrap;">${e.preferred_date || '—'}${e.preferred_time ? '<div style="font-size:0.72rem;color:var(--text-muted);">' + e.preferred_time + '</div>' : ''}</td>
    <td><span class="admin-status-badge enq-badge-${(e.status || 'pending').toLowerCase()}">${e.status}</span></td>
    <td class="admin-td-muted" style="font-size:0.8rem;max-width:160px;">${esc(e.admin_notes || '—')}</td>
  </tr>`).join('') || '<tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted);">No enquiries assigned to you.</td></tr>';

  document.getElementById('mobileCards').innerHTML = filtered.map(e => `
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.12);border-radius:14px;padding:16px;margin-bottom:12px;">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
          <div style="font-weight:700;color:#fff;font-size:0.95rem;">${esc(e.full_name)}</div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">${esc(e.phone)}</div>
        </div>
        <span class="admin-status-badge enq-badge-${(e.status || 'pending').toLowerCase()}">${e.status}</span>
      </div>
      <div style="font-size:0.82rem;color:rgba(240,230,211,0.6);margin-bottom:8px;">
        ${esc(e.selected_services)}${e.preferred_date ? '<span style="color:var(--text-muted);margin-left:6px;">· ' + e.preferred_date + '</span>' : ''}
      </div>
      ${e.admin_notes ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;font-style:italic;">${esc(e.admin_notes)}</div>` : ''}
      <div class="d-flex gap-2 flex-wrap">
        <a href="tel:${e.phone}" class="appt-mob-btn btn-call"><i class="fas fa-phone"></i> Call</a>
        <button onclick="navigator.clipboard.writeText('${e.phone}').then(()=>showToast('Copied!','success'))"
          class="appt-mob-btn btn-copy"><i class="fas fa-copy"></i> Copy</button>
      </div>
    </div>`).join('');
};

renderTable();

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar = document.getElementById('adminSidebar'), overlay = document.getElementById('sidebarOverlay'), toggleBtn = document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); document.body.style.overflow = 'hidden'; });
overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); document.body.style.overflow = ''; });
</script>
</body>
</html>
