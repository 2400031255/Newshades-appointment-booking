<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Requests – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Employee Portal</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="enquiries.html"><span class="sidebar-nav-label"><i class="fas fa-clipboard-list"></i> My Enquiries</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> My Attendance</span></a>
    <a href="leave.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="salary.html"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> My Salary</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">Leave Requests</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="empName"></span></div>
  </div>
  <div class="admin-page-body">
    <div class="row g-4">
      <!-- Apply Form -->
      <div class="col-lg-4">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-plus me-2" style="color:var(--gold);"></i>Apply for Leave</h6>
          <form id="leaveForm">
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">LEAVE TYPE</label>
              <select id="leaveType" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;cursor:pointer;">
                <option>Sick Leave</option><option>Casual Leave</option><option>Personal Leave</option><option>Other</option>
              </select>
            </div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">FROM DATE *</label><input type="date" id="leaveFrom" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/></div>
            <div class="mb-3"><label class="field-label mb-1" style="font-size:0.75rem;">TO DATE *</label><input type="date" id="leaveTo" required style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;"/></div>
            <div class="mb-4"><label class="field-label mb-1" style="font-size:0.75rem;">REASON</label><textarea id="leaveReason" rows="3" style="width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(201,168,76,0.2);color:#fff;outline:none;font-size:0.9rem;resize:vertical;font-family:'DM Sans',sans-serif;" placeholder="Brief reason for leave…"></textarea></div>
            <button type="submit" class="btn-gold" style="width:100%;justify-content:center;"><i class="fas fa-paper-plane me-2"></i>Submit Request</button>
          </form>
        </div>
      </div>
      <!-- My Requests -->
      <div class="col-lg-8">
        <div class="admin-card">
          <h6 class="fw-bold mb-4" style="color:#fff;">My Leave History <span style="color:var(--gold);" id="leaveCount"></span></h6>
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr></thead>
              <tbody id="leaveBody"><tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getEmployeeProfile, requireActiveEmployee, getLeaveRequests, createLeaveRequest, showToast } from '../js/firebase.js';

const { user, emp } = await requireActiveEmployee('../login.html');
document.getElementById('empName').textContent = emp.full_name || user.email;

// Set min date to today
document.getElementById('leaveFrom').min = new Date().toISOString().slice(0,10);
document.getElementById('leaveTo').min = new Date().toISOString().slice(0,10);

const statusStyle = { Pending:'background:rgba(255,170,77,0.16);color:#ffc36b;', Approved:'background:rgba(37,211,102,0.16);color:#7ce0aa;', Rejected:'background:rgba(255,107,107,0.16);color:#ff6b6b;' };

async function load() {
  const mine = (await getLeaveRequests(user.uid)).sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));
  document.getElementById('leaveCount').textContent = `(${mine.length})`;
  document.getElementById('leaveBody').innerHTML = mine.map(l => {
    const days = l.from_date && l.to_date ? Math.ceil((new Date(l.to_date)-new Date(l.from_date))/(86400000))+1 : '—';
    const st = statusStyle[l.status] || statusStyle.Pending;
    return `<tr>
      <td class="admin-td-bold">${l.leave_type||'—'}</td>
      <td class="admin-td-muted">${l.from_date||'—'}</td>
      <td class="admin-td-muted">${l.to_date||'—'}</td>
      <td class="admin-td-muted">${days}</td>
      <td style="font-size:0.82rem;color:rgba(240,230,211,0.7);max-width:180px;">${(l.reason||'—').slice(0,60)}</td>
      <td><span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;${st}">${l.status||'Pending'}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No leave requests yet.</td></tr>';
}
load();

document.getElementById('leaveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const from = document.getElementById('leaveFrom').value;
  const to   = document.getElementById('leaveTo').value;
  if (to < from) { showToast('To date must be after From date.', 'warning'); return; }
  try {
    await createLeaveRequest({ employee_id: user.uid, employee_name: emp.full_name, leave_type: document.getElementById('leaveType').value, from_date: from, to_date: to, reason: document.getElementById('leaveReason').value });
    showToast('Leave request submitted!', 'success');
    e.target.reset();
    load();
  } catch { showToast('Failed to submit.', 'danger'); }
});

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
