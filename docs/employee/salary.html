<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Salary – New Shades</title>
  <style>html,body{background:#050407!important;color:rgba(245,235,215,0.92);}</style>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/></noscript>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/></noscript>
  <link href="../style.css" rel="stylesheet"/>
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand d-flex align-items-center gap-2"><img src="../images/logo.jpeg" alt="NS" class="admin-brand-logo"/><div><h4>New Shades</h4><small style="color:rgba(255,255,255,0.4);font-size:0.75rem;">Employee Portal</small></div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html"><span class="sidebar-nav-label"><i class="fas fa-tachometer-alt"></i> Dashboard</span></a>
    <a href="attendance.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-check"></i> My Attendance</span></a>
    <a href="leave.html"><span class="sidebar-nav-label"><i class="fas fa-calendar-minus"></i> Leave Requests</span></a>
    <a href="salary.html" class="active"><span class="sidebar-nav-label"><i class="fas fa-money-bill-wave"></i> My Salary</span></a>
    <a href="profile.html"><span class="sidebar-nav-label"><i class="fas fa-user-circle"></i> My Profile</span></a>
    <a href="#" id="logoutBtn" style="margin-top:auto;color:#ff6b6b;"><span class="sidebar-nav-label"><i class="fas fa-sign-out-alt"></i> Logout</span></a>
  </nav>
</div>
<div class="admin-content">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button id="sidebarToggle"><i class="fas fa-bars"></i></button><h6 class="mb-0 fw-bold">My Salary</h6></div>
    <div class="d-flex align-items-center gap-2"><span class="text-muted small" id="empName"></span></div>
  </div>
  <div class="admin-page-body">
    <!-- Current Month Slip -->
    <div class="row g-4 mb-4">
      <div class="col-lg-5">
        <div class="admin-card" style="background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border-color:rgba(201,168,76,0.3);">
          <h6 class="fw-bold mb-4" style="color:#fff;font-family:'Playfair Display',serif;"><i class="fas fa-file-invoice-dollar me-2" style="color:var(--gold);"></i>Current Month</h6>
          <div id="currentSlip" style="color:var(--text-muted);text-align:center;padding:20px 0;">Loading…</div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="admin-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h6 class="fw-bold mb-0" style="color:#fff;">Salary History</h6>
            <input type="month" id="monthFilter" style="padding:7px 12px;border-radius:999px;border:1px solid rgba(201,168,76,0.24);background:rgba(255,255,255,0.06);color:#fff;outline:none;font-size:0.85rem;" onchange="filterMonth()"/>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Month</th><th>Base</th><th>Bonus</th><th>Deductions</th><th>Net Pay</th><th>Status</th></tr></thead>
              <tbody id="salaryBody"><tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
<script type="module">
import { requireAuth, logoutUser, getEmployeeProfile, db } from '../js/firebase.js';
import { getDocs, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const user = await requireAuth('../login.html');
const emp = await getEmployeeProfile(user.uid);
if (!emp) { window.location.href = '../login.html'; }
document.getElementById('empName').textContent = emp.full_name || user.email;

let allPayroll = [];

async function load() {
  const q = query(collection(db,'payroll'), where('employee_id','==',user.uid));
  const snap = await getDocs(q);
  allPayroll = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.month.localeCompare(a.month));
  renderTable(allPayroll);
  renderCurrentSlip();
}
load();

function renderCurrentSlip() {
  const now = new Date();
  const month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const slip = allPayroll.find(p=>p.month===month);
  const el = document.getElementById('currentSlip');
  if (!slip) {
    el.innerHTML = `<div style="color:var(--text-muted);font-size:0.88rem;">No payroll record for this month yet.</div><div style="margin-top:8px;font-size:0.8rem;color:rgba(240,230,211,0.4);">Contact admin for details.</div>`;
    return;
  }
  el.innerHTML = `
    <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:16px;">${slip.month}</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="color:rgba(240,230,211,0.7);">Base Salary</span><span style="color:#fff;font-weight:600;">₹${((slip.base_salary||slip.net_salary||0)).toLocaleString()}</span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="color:rgba(240,230,211,0.7);">Bonus</span><span style="color:#7ce0aa;font-weight:600;">+₹${(slip.bonus||0).toLocaleString()}</span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:16px;"><span style="color:rgba(240,230,211,0.7);">Deductions</span><span style="color:#ff6b6b;font-weight:600;">-₹${(slip.deductions||0).toLocaleString()}</span></div>
    <div style="border-top:1px solid rgba(201,168,76,0.2);padding-top:16px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;color:#fff;">Net Pay</span>
      <span style="font-size:1.4rem;font-weight:700;color:var(--gold);">₹${(slip.net_salary || ((slip.base_salary||0)+(slip.bonus||0)-(slip.deductions||0))).toLocaleString()}</span>
    </div>
    <div style="margin-top:12px;text-align:center;"><span style="padding:4px 16px;border-radius:999px;font-size:0.75rem;font-weight:700;${slip.status==='Paid'?'background:rgba(37,211,102,0.16);color:#7ce0aa;':'background:rgba(255,170,77,0.16);color:#ffc36b;'}">${slip.status||'Pending'}</span></div>`;
}

function renderTable(records) {
  document.getElementById('salaryBody').innerHTML = records.map(p => {
    const net = p.net_salary || ((p.base_salary||0)+(p.bonus||0)-(p.deductions||0));
    return `<tr>
      <td class="admin-td-bold">${p.month}</td>
      <td class="admin-td-muted">₹${(p.base_salary||0).toLocaleString()}</td>
      <td style="color:#7ce0aa;">+₹${(p.bonus||0).toLocaleString()}</td>
      <td style="color:#ff6b6b;">-₹${(p.deductions||0).toLocaleString()}</td>
      <td style="color:var(--gold);font-weight:700;">₹${net.toLocaleString()}</td>
      <td><span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;${p.status==='Paid'?'background:rgba(37,211,102,0.16);color:#7ce0aa;':'background:rgba(255,170,77,0.16);color:#ffc36b;'}">${p.status||'Pending'}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No salary records found.</td></tr>';
}

window.filterMonth = () => {
  const val = document.getElementById('monthFilter').value;
  renderTable(val ? allPayroll.filter(p=>p.month===val) : allPayroll);
};

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logoutUser(); });
const sidebar=document.getElementById('adminSidebar'),overlay=document.getElementById('sidebarOverlay'),toggleBtn=document.getElementById('sidebarToggle');
toggleBtn.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');document.body.style.overflow='hidden';});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');document.body.style.overflow='';});
</script>
</body>
</html>
